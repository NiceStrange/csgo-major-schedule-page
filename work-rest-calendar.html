<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>节假日与休息日日历</title>
    <style>
      :root {
        --bg: #f2f2f7;
        --bg-strong: #e9e9ef;
        --paper: rgba(255, 255, 255, 0.78);
        --paper-strong: rgba(255, 255, 255, 0.92);
        --paper-solid: #ffffff;
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --line: rgba(60, 60, 67, 0.12);
        --line-strong: rgba(60, 60, 67, 0.18);
        --accent: #0a84ff;
        --accent-deep: #0066cc;
        --accent-soft: rgba(10, 132, 255, 0.12);
        --holiday: rgba(255, 159, 10, 0.16);
        --holiday-ink: #b05a00;
        --rest: rgba(48, 209, 88, 0.16);
        --rest-ink: #1e8744;
        --mix: rgba(191, 90, 242, 0.16);
        --mix-ink: #8e3bd1;
        --makeup: rgba(255, 69, 58, 0.16);
        --makeup-ink: #c03221;
        --today: #0a84ff;
        --shadow: 0 28px 72px rgba(29, 29, 31, 0.12);
        --shadow-soft: 0 12px 30px rgba(29, 29, 31, 0.07);
        --hero-sheen: linear-gradient(120deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.16) 42%, rgba(255, 255, 255, 0.52) 100%);
      }

      body.dark-theme {
        --bg: #111214;
        --bg-strong: #050608;
        --paper: rgba(28, 28, 30, 0.82);
        --paper-strong: rgba(36, 36, 38, 0.94);
        --paper-solid: #1c1c1e;
        --ink: #f5f5f7;
        --muted: #98989f;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.14);
        --accent-soft: rgba(10, 132, 255, 0.2);
        --holiday: rgba(255, 159, 10, 0.14);
        --rest: rgba(48, 209, 88, 0.14);
        --mix: rgba(191, 90, 242, 0.16);
        --makeup: rgba(255, 69, 58, 0.14);
        --shadow: 0 26px 64px rgba(0, 0, 0, 0.5);
        --shadow-soft: 0 10px 24px rgba(0, 0, 0, 0.28);
        --hero-sheen: linear-gradient(140deg, rgba(255, 255, 255, 0.08), transparent 42%, rgba(255, 255, 255, 0.03));
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Display",
          "SF Pro Text",
          "PingFang SC",
          "Helvetica Neue",
          sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 0% 0%, rgba(0, 113, 227, 0.14), transparent 28%),
          radial-gradient(circle at 100% 0%, rgba(175, 82, 222, 0.12), transparent 24%),
          radial-gradient(circle at 50% 100%, rgba(52, 199, 89, 0.1), transparent 28%),
          linear-gradient(180deg, #fbfbfd 0%, var(--bg) 38%, var(--bg-strong) 100%);
        overflow-x: hidden;
        transition: background 280ms ease, color 220ms ease;
      }

      body.dark-theme {
        color-scheme: dark;
        background:
          radial-gradient(circle at 18% 0%, rgba(10, 132, 255, 0.08), transparent 22%),
          radial-gradient(circle at 85% 8%, rgba(99, 102, 241, 0.06), transparent 18%),
          linear-gradient(180deg, #191a1e 0%, var(--bg) 34%, var(--bg-strong) 100%);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: auto;
        width: 340px;
        height: 340px;
        border-radius: 999px;
        filter: blur(60px);
        pointer-events: none;
        opacity: 0.55;
        z-index: 0;
      }

      body::before {
        top: -80px;
        right: -90px;
        background: rgba(0, 113, 227, 0.18);
        animation: floatBlobOne 18s ease-in-out infinite;
      }

      body::after {
        bottom: -120px;
        left: -80px;
        background: rgba(175, 82, 222, 0.14);
        animation: floatBlobTwo 24s ease-in-out infinite;
      }

      body.dark-theme::before {
        background: rgba(10, 132, 255, 0.08);
        opacity: 0.24;
      }

      body.dark-theme::after {
        background: rgba(99, 102, 241, 0.08);
        opacity: 0.18;
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(1340px, calc(100% - 36px));
        margin: 28px auto 44px;
      }

      .hero {
        position: relative;
        padding: 18px 18px 22px;
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 30px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.56)),
          var(--paper);
        box-shadow: var(--shadow);
        backdrop-filter: blur(26px) saturate(165%);
        -webkit-backdrop-filter: blur(26px) saturate(165%);
        overflow: hidden;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--hero-sheen);
        opacity: 0.42;
        pointer-events: none;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.9), transparent 62%);
      }

      .hero-top {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .hero-actions {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
      }

      .traffic-lights {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .traffic-lights span {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      .traffic-lights span:nth-child(1) {
        background: #ff5f57;
      }

      .traffic-lights span:nth-child(2) {
        background: #febc2e;
      }

      .traffic-lights span:nth-child(3) {
        background: #28c840;
      }

      .hero-badge {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.68);
        border: 1px solid rgba(60, 60, 67, 0.08);
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        user-select: none;
        transition: 180ms ease;
      }

      .hero-badge::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(180deg, #34c759, #1ea94b);
        box-shadow: 0 0 0 4px rgba(52, 199, 89, 0.12);
        animation: pulseDot 2.6s ease-in-out infinite;
      }

      .hero-badge:hover {
        transform: translateY(-1px);
        color: var(--accent);
        border-color: rgba(10, 132, 255, 0.18);
        background: rgba(255, 255, 255, 0.78);
      }

      .theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 7px 12px 7px 8px;
        border-radius: 999px;
        border: 1px solid rgba(60, 60, 67, 0.08);
        background: rgba(255, 255, 255, 0.64);
        color: var(--muted);
        font: inherit;
        font-size: 0.79rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          color 180ms ease,
          border-color 180ms ease,
          background 180ms ease;
      }

      .theme-toggle:hover {
        transform: translateY(-1px);
        color: var(--ink);
        border-color: rgba(10, 132, 255, 0.16);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.78),
          0 10px 20px rgba(29, 29, 31, 0.08);
      }

      .theme-toggle:focus-visible {
        outline: none;
        box-shadow:
          0 0 0 4px rgba(10, 132, 255, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.78);
      }

      .theme-toggle-track {
        position: relative;
        width: 34px;
        height: 20px;
        border-radius: 999px;
        background: rgba(120, 120, 128, 0.28);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);
        transition: background 200ms ease;
      }

      .theme-toggle-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffffff, #f2f2f7);
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.82);
        transition: transform 220ms ease, background 220ms ease;
      }

      body.dark-theme .theme-toggle-track {
        background: rgba(10, 132, 255, 0.8);
      }

      body.dark-theme .theme-toggle-thumb {
        transform: translateX(14px);
        background: linear-gradient(180deg, #ffffff, #dfe6f7);
      }

      .hero-badge:focus-visible {
        outline: none;
        box-shadow:
          0 0 0 4px rgba(10, 132, 255, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.72);
      }

      .hero h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(2.4rem, 4.6vw, 4.2rem);
        font-weight: 700;
        line-height: 0.94;
        letter-spacing: -0.06em;
      }

      .hero p {
        margin: 16px 0 0;
        max-width: 760px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.75;
      }

      .layout {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 20px;
        margin-top: 20px;
      }

      .panel,
      .calendar-board {
        border: 1px solid rgba(255, 255, 255, 0.74);
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.62)),
          var(--paper);
        box-shadow: var(--shadow);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
      }

      .panel {
        padding: 14px;
        align-self: start;
        position: sticky;
        top: 16px;
      }

      .section {
        position: relative;
        padding: 16px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.7);
        background: rgba(255, 255, 255, 0.56);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.62);
        transition:
          transform 220ms ease,
          box-shadow 220ms ease,
          border-color 220ms ease;
      }

      .section::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 48%);
        pointer-events: none;
      }

      .section:hover {
        transform: translateY(-1px);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.72),
          0 10px 22px rgba(29, 29, 31, 0.05);
        border-color: rgba(255, 255, 255, 0.82);
      }

      .section + .section {
        margin-top: 12px;
      }

      .section h2 {
        margin: 0 0 12px;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field label {
        display: block;
        margin-bottom: 7px;
        font-size: 0.83rem;
        font-weight: 500;
        color: var(--muted);
      }

      .field input,
      .field textarea,
      .field button {
        width: 100%;
        border-radius: 14px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        background: rgba(255, 255, 255, 0.92);
        color: var(--ink);
        font: inherit;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
      }

      .field input,
      .field textarea {
        padding: 12px 14px;
        transition: 180ms ease;
      }

      .field input:focus,
      .field textarea:focus {
        outline: none;
        border-color: rgba(0, 113, 227, 0.35);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.7),
          0 0 0 4px rgba(10, 132, 255, 0.12);
      }

      .field textarea {
        min-height: 184px;
        resize: vertical;
        line-height: 1.6;
      }

      .button-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .button-row button {
        flex: 1 1 140px;
        cursor: pointer;
        padding: 12px 16px;
        font-weight: 600;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          filter 180ms ease;
      }

      .primary {
        border-color: rgba(0, 113, 227, 0.24);
        background: linear-gradient(180deg, #44a1ff 0%, #1488ff 45%, #0a84ff 100%);
        color: #fff;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.24),
          0 10px 20px rgba(0, 113, 227, 0.22);
      }

      .ghost {
        background: rgba(255, 255, 255, 0.82);
      }

      .button-row button:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-soft);
        filter: saturate(1.03);
      }

      .button-row button:active {
        transform: translateY(0);
      }

      .legend {
        display: grid;
        gap: 12px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .swatch {
        width: 16px;
        height: 16px;
        border-radius: 6px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.64);
      }

      .calendar-board {
        padding: 16px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.06);
      }

      .toolbar-main {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        width: 100%;
      }

      .toolbar-copy {
        flex: 1 1 auto;
      }

      .month-switcher {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px;
        border-radius: 999px;
        border: 1px solid rgba(15, 23, 42, 0.06);
        background: rgba(255, 255, 255, 0.84);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.68);
      }

      .month-switcher button {
        border: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        border-radius: 999px;
        padding: 10px 14px;
        cursor: pointer;
        transition: 180ms ease;
      }

      .month-switcher button:hover {
        background: rgba(0, 113, 227, 0.1);
        color: var(--accent);
      }

      .month-switcher button:active {
        transform: scale(0.98);
      }

      .nav-icon {
        min-width: 42px;
        padding-inline: 0;
        font-size: 1.1rem;
      }

      .month-chip {
        min-width: 112px;
        text-align: center;
        color: var(--ink);
        font-size: 0.92rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
      }

      .toolbar h2 {
        margin: 0;
        font-size: 1.75rem;
        letter-spacing: -0.03em;
      }

      .toolbar p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.6;
      }

      .stats {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .stat {
        position: relative;
        min-width: 126px;
        padding: 13px 15px;
        border-radius: 18px;
        border: 1px solid rgba(15, 23, 42, 0.06);
        background: rgba(255, 255, 255, 0.88);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.66);
        overflow: hidden;
        transition:
          transform 200ms ease,
          box-shadow 200ms ease,
          border-color 200ms ease;
      }

      .stat::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(10, 132, 255, 0.08), transparent 60%);
        opacity: 0.8;
        pointer-events: none;
      }

      .stat:hover {
        transform: translateY(-1px);
        border-color: rgba(10, 132, 255, 0.12);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.72),
          0 10px 22px rgba(29, 29, 31, 0.06);
      }

      .stat strong {
        position: relative;
        z-index: 1;
        display: block;
        font-size: 1.32rem;
        letter-spacing: -0.03em;
      }

      .stat span {
        position: relative;
        z-index: 1;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .months {
        display: block;
      }

      .month {
        max-width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(248, 249, 252, 0.84));
        overflow: hidden;
        box-shadow: var(--shadow-soft);
        animation: monthReveal 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .month-head {
        display: flex;
        align-items: baseline;
        justify-content: center;
        padding: 18px 20px 14px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.06);
        background: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.34));
        text-align: center;
        flex-direction: column;
        gap: 4px;
      }

      .month-head h3 {
        margin: 0;
        font-size: 1.16rem;
        letter-spacing: -0.03em;
      }

      .month-head span {
        color: var(--muted);
        font-size: 0.78rem;
      }

      .weekdays,
      .days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }

      .weekdays {
        padding: 12px 14px 4px;
      }

      .weekdays div {
        padding: 6px 0 8px;
        text-align: center;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .days {
        padding: 0 14px 14px;
        gap: 8px;
      }

      .day {
        min-height: 104px;
        padding: 10px 10px 12px;
        border-radius: 18px;
        border: 1px solid rgba(15, 23, 42, 0.06);
        background: rgba(255, 255, 255, 0.86);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.58);
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          border-color 180ms ease;
        animation: dayReveal 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: calc(var(--day-index, 0) * 16ms);
      }

      .day:hover:not(.empty) {
        transform: translateY(-2px) scale(1.01);
        border-color: rgba(15, 23, 42, 0.1);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.72),
          0 14px 24px rgba(15, 23, 42, 0.09);
      }

      .day.empty {
        background: transparent;
        border-color: transparent;
        box-shadow: none;
      }

      .day-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      .day-number {
        font-weight: 700;
        font-size: 1.18rem;
        letter-spacing: -0.04em;
      }

      .day-number.today-mark {
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--today);
        color: #fff;
        box-shadow: 0 6px 14px rgba(10, 132, 255, 0.28);
      }

      .flag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        height: 22px;
        border-radius: 999px;
        padding: 0 8px;
        font-size: 0.68rem;
        font-weight: 700;
        border: 1px solid rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(10px);
      }

      .flag.holiday {
        color: var(--holiday-ink);
        background: rgba(255, 149, 0, 0.16);
      }

      .flag.rest {
        color: var(--rest-ink);
        background: rgba(52, 199, 89, 0.14);
      }

      .flag.makeup {
        color: var(--makeup-ink);
        background: rgba(255, 69, 58, 0.14);
      }

      .day-label {
        color: color-mix(in srgb, var(--ink) 72%, transparent);
        margin-top: 4px;
        font-size: 0.76rem;
        line-height: 1.32;
        word-break: break-all;
        min-height: 1.4em;
      }

      .day-label:empty {
        display: none;
      }

      .day-meta {
        margin-top: 8px;
        font-size: 0.7rem;
        color: var(--muted);
      }

      .day-meta:empty,
      .toolbar p:empty {
        display: none;
      }

      .day.is-holiday {
        background: linear-gradient(180deg, rgba(255, 149, 0, 0.16), rgba(255, 149, 0, 0.08));
      }

      .day.is-rest {
        background: linear-gradient(180deg, rgba(52, 199, 89, 0.16), rgba(52, 199, 89, 0.08));
      }

      .day.is-overlap {
        background: linear-gradient(180deg, rgba(175, 82, 222, 0.18), rgba(175, 82, 222, 0.08));
      }

      .day.is-makeup {
        background: linear-gradient(180deg, rgba(255, 69, 58, 0.14), rgba(255, 69, 58, 0.06));
      }

      .day.is-today {
        border-color: rgba(10, 132, 255, 0.34);
        box-shadow:
          inset 0 0 0 1px rgba(10, 132, 255, 0.12),
          0 0 0 3px rgba(10, 132, 255, 0.08),
          0 16px 26px rgba(10, 132, 255, 0.1);
      }

      .hint {
        margin-top: 10px;
        font-size: 0.82rem;
        color: var(--muted);

      const applyButton = document.getElementById("apply-button");
      const weatherBadge = document.getElementById("weather-badge");
      const themeToggle = document.getElementById("theme-toggle");
      const themeToggleText = document.getElementById("theme-toggle-text");
      const officialSummaryTitle = document.getElementById("official-summary-title");
      const officialSummaryText = document.getElementById("official-summary-text");
      const officialSourceLinks = document.getElementById("official-source-links");
      const monthsNode = document.getElementById("months");
      const calendarTitle = document.getElementById("calendar-title");
      const calendarSubtitle = document.getElementById("calendar-subtitle");
      const monthChip = document.getElementById("month-chip");
      const holidayCount = document.getElementById("holiday-count");
      const restCount = document.getElementById("rest-count");
      const makeupCount = document.getElementById("makeup-count");
      const overlapCount = document.getElementById("overlap-count");
      const prevMonthButton = document.getElementById("prev-month-button");
      const nextMonthButton = document.getElementById("next-month-button");
      const todayMonthButton = document.getElementById("today-month-button");
      const supportedYears = Object.keys(OFFICIAL_SCHEDULES)
        .map((year) => Number(year))
        .sort((left, right) => left - right);
      const weatherCodeMap = {
        0: "晴",
        1: "大部晴朗",
        2: "局部多云",
        3: "阴",
        45: "有雾",
        48: "冻雾",
        51: "毛毛雨",
        53: "小雨",
        55: "细雨",
        56: "冻毛毛雨",
        57: "冻雨",
        61: "小雨",
        63: "中雨",
        65: "大雨",
        66: "冻雨",
        67: "强冻雨",
        71: "小雪",
        73: "中雪",
        75: "大雪",
        77: "阵雪",
        80: "阵雨",
        81: "强阵雨",
        82: "暴雨",
        85: "阵雪",
        86: "强阵雪",
        95: "雷阵雨",
        96: "雷雨夹冰雹",
        99: "强雷雨夹冰雹"
      };

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function setWeatherBadge(text) {
        weatherBadge.textContent = text;
      }

      function applyTheme(theme) {
        const isDark = theme === "dark";
        document.body.classList.toggle("dark-theme", isDark);
        themeToggle.setAttribute("aria-pressed", String(isDark));
        themeToggleText.textContent = isDark ? "深色模式" : "浅色模式";
      }

      function loadThemePreference() {
        const stored = localStorage.getItem(THEME_STORAGE_KEY);
        if (stored === "light" || stored === "dark") {
          return stored;
        }

        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      function toggleTheme() {
        const nextTheme = document.body.classList.contains("dark-theme") ? "light" : "dark";
        applyTheme(nextTheme);
        localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      }

      async function ensureLatestBuild() {
        try {
          const response = await fetch(`./version.json?ts=${Date.now()}`, {
            cache: "no-store"
          });

          if (!response.ok) {
            return false;
          }

          const payload = await response.json();
          const latestVersion = payload.version;
          if (!latestVersion || latestVersion === APP_VERSION) {
            return false;
          }

          const nextUrl = new URL(window.location.href);
          if (nextUrl.searchParams.get("v") !== latestVersion) {
            nextUrl.searchParams.set("v", latestVersion);
            window.location.replace(nextUrl.toString());
            return true;
          }
        } catch (error) {
          // Ignore update-check failures so the calendar still loads offline or on flaky networks.
        }

        return false;
      }

      function formatWeather(city, current) {
        const weatherText = weatherCodeMap[current.weather_code] || "天气正常";
        const temperature = Math.round(current.temperature_2m);
        return `${city} ${temperature}°C ${weatherText}`;
      }

      async function fetchWeather(latitude, longitude, city) {
        const url = new URL("https://api.open-meteo.com/v1/forecast");
        url.searchParams.set("latitude", String(latitude));
        url.searchParams.set("longitude", String(longitude));
        url.searchParams.set("current", "temperature_2m,weather_code");
        url.searchParams.set("timezone", "auto");

        const response = await fetch(url.toString());
        if (!response.ok) {
          throw new Error(`weather ${response.status}`);
        }

        const payload = await response.json();
        if (!payload.current) {
          throw new Error("missing current weather");
        }

        setWeatherBadge(formatWeather(city, payload.current));
      }

      function getCurrentPosition() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error("geolocation unavailable"));
            return;
          }

          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: false,
            timeout: 5000,
            maximumAge: 15 * 60 * 1000
          });
        });
      }

      async function updateWeatherBadge() {
        setWeatherBadge("天气读取中");

        try {
          const position = await getCurrentPosition();
          await fetchWeather(position.coords.latitude, position.coords.longitude, "当前位置");
          return;
        } catch (error) {
          // Ignore and fall back to Shanghai so the badge always shows a weather status.
        }

        try {
          await fetchWeather(31.2304, 121.4737, "上海");
        } catch (error) {
          setWeatherBadge("天气暂不可用");
        }
      }

      async function watchLocationPermission() {
        if (!navigator.permissions || !navigator.permissions.query) {
          return;
        }

        try {
          const permissionStatus = await navigator.permissions.query({ name: "geolocation" });
          permissionStatus.onchange = () => {
            if (permissionStatus.state === "granted") {
              updateWeatherBadge();
            }
          };
        } catch (error) {
          // Some browsers do not support querying geolocation permissions.
        }
      }

      function toDateKey(date) {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      }

      function expandDateRange(startText, endText) {
        const dates = [];
        const cursor = new Date(`${startText}T00:00:00`);
        const end = new Date(`${endText}T00:00:00`);

        while (cursor <= end) {
          dates.push(toDateKey(cursor));
          cursor.setDate(cursor.getDate() + 1);
        }

        return dates;
      }

      function getOfficialSchedule(year) {
        return OFFICIAL_SCHEDULES[year] || null;
      }

      function createOfficialHolidayMap(year) {
        const schedule = getOfficialSchedule(year);
        const map = new Map();

        if (!schedule) {
          return map;
        }

        schedule.holidays.forEach((holiday) => {
          holiday.dates.forEach((date) => {
            map.set(date, holiday.name);
          });
        });

        return map;
      }

      function createOfficialWorkdaySet(year) {
        const schedule = getOfficialSchedule(year);
        return new Set(schedule ? schedule.workdays : []);
      }

      function getDefaultSettings() {
        const now = new Date();
        return {
          year: now.getFullYear(),
          viewMonth: now.getMonth(),
          cycleStart: `${now.getFullYear()}-01-01`,
          workDays: 3,
          restDays: 1
        };
      }

      function loadSettings() {
        const defaults = getDefaultSettings();

        try {
          const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
          if (!raw) {
            return defaults;
          }

          const parsed = JSON.parse(raw);
          return {
            year: Number(parsed.year) || defaults.year,
            viewMonth: Number.isInteger(parsed.viewMonth) ? parsed.viewMonth : defaults.viewMonth,
            cycleStart: parsed.cycleStart || defaults.cycleStart,
            workDays: Number(parsed.workDays) || defaults.workDays,
            restDays: Number(parsed.restDays) || defaults.restDays
          };
        } catch (error) {
          return defaults;
        }
      }

      function saveSettings(settings) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
      }

      function getDateDiffDays(baseDate, targetDate) {
        const millisecondsPerDay = 24 * 60 * 60 * 1000;
        const base = Date.UTC(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
        const target = Date.UTC(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
        return Math.floor((target - base) / millisecondsPerDay);
      }

      function getCyclePosition(targetDate, cycleStartText, workDays, restDays) {
        const cycleStart = new Date(`${cycleStartText}T00:00:00`);
        if (Number.isNaN(cycleStart.getTime())) {
          return null;
        }

        const cycleLength = workDays + restDays;
        if (cycleLength <= 0) {
          return null;
        }

        const diff = getDateDiffDays(cycleStart, targetDate);
        return ((diff % cycleLength) + cycleLength) % cycleLength;
      }

      function isRestDay(targetDate, cycleStartText, workDays, restDays) {
        const position = getCyclePosition(targetDate, cycleStartText, workDays, restDays);
        return position !== null && position >= workDays;
      }

      function getSettingsFromInputs() {
        return {
          year: Number(yearInput.value),
          viewMonth: viewState.month,
          cycleStart: cycleStartInput.value,
          workDays: Number(workDaysInput.value),
          restDays: Number(restDaysInput.value)
        };
      }

      function fillInputs(settings) {
        yearInput.value = settings.year;
        cycleStartInput.value = settings.cycleStart;
        workDaysInput.value = settings.workDays;
        restDaysInput.value = settings.restDays;
      }

      function clampMonth(month) {
        return Math.min(11, Math.max(0, month));
      }

      function setViewMonth(month) {
        viewState.month = clampMonth(month);
      }

      function shiftMonth(step) {
        let year = Number(yearInput.value) || new Date().getFullYear();
        let month = viewState.month + step;

        if (month < 0) {
          month = 11;
          year -= 1;
        } else if (month > 11) {
          month = 0;
          year += 1;
        }

        yearInput.value = year;
        setViewMonth(month);
        renderCalendar();
      }

      function renderOfficialSummary(settings, holidayMap, workdaySet) {
        const schedule = getOfficialSchedule(settings.year);

        officialSourceLinks.innerHTML = supportedYears
          .map((year) => {
            const activeClass = year === settings.year ? "source-link is-active" : "source-link";
            return `<a class="${activeClass}" href="${OFFICIAL_SCHEDULES[year].url}" target="_blank" rel="noreferrer">${year} 官方通知</a>`;
          })
          .join("");

        if (!schedule) {
          officialSummaryTitle.textContent = `${settings.year} 年暂未内置官方节假日`;
          officialSummaryText.textContent = `当前版本已同步 ${supportedYears.join("、")} 年国务院办公厅通知；如果后续公布新的年度安排，再把该年份补进页面即可。`;
          return;
        }

        officialSummaryTitle.textContent = `已同步 ${settings.year} 年官方安排`;
        officialSummaryText.textContent = `依据${schedule.noticeNumber}（${schedule.publishedAt}）自动高亮 ${holidayMap.size} 个节假日日期和 ${workdaySet.size} 个调休上班日。`;
      }

      function renderCalendar() {
        const settings = getSettingsFromInputs();
        const holidayMap = createOfficialHolidayMap(settings.year);
        const workdaySet = createOfficialWorkdaySet(settings.year);
        const todayKey = toDateKey(new Date());
        const activeMonth = clampMonth(settings.viewMonth);

        let holidayTotal = 0;
        let restTotal = 0;
        let makeupTotal = 0;
        let overlapTotal = 0;

        calendarTitle.textContent = `${settings.year} 年 ${monthNames[activeMonth]}`;
        calendarSubtitle.textContent = "";

        monthChip.textContent = `${settings.year}.${pad(activeMonth + 1)}`;
        monthsNode.innerHTML = "";

        const firstDay = new Date(settings.year, activeMonth, 1);
        const daysInMonth = new Date(settings.year, activeMonth + 1, 0).getDate();
        const startWeekday = (firstDay.getDay() + 6) % 7;

        const monthNode = document.createElement("section");
        monthNode.className = "month";

        const monthHead = document.createElement("div");
        monthHead.className = "month-head";
        monthHead.innerHTML = `<h3>${monthNames[activeMonth]}</h3><span>${settings.year}.${pad(activeMonth + 1)}</span>`;
        monthNode.appendChild(monthHead);

        const weekdayRow = document.createElement("div");
        weekdayRow.className = "weekdays";
        weekdayNames.forEach((weekday) => {
          const node = document.createElement("div");
          node.textContent = weekday;
          weekdayRow.appendChild(node);
        });
        monthNode.appendChild(weekdayRow);

        const daysGrid = document.createElement("div");
        daysGrid.className = "days";

        for (let index = 0; index < startWeekday; index += 1) {
          const emptyNode = document.createElement("div");
          emptyNode.className = "day empty";
          daysGrid.appendChild(emptyNode);
        }

        for (let day = 1; day <= daysInMonth; day += 1) {
          const currentDate = new Date(settings.year, activeMonth, day);
          const dateKey = toDateKey(currentDate);
          const holidayLabel = holidayMap.get(dateKey);
          const isOfficialWorkday = workdaySet.has(dateKey);
          const rest = !isOfficialWorkday && isRestDay(currentDate, settings.cycleStart, settings.workDays, settings.restDays);
          const isToday = dateKey === todayKey;
          const isWeekend = currentDate.getDay() === 0 || currentDate.getDay() === 6;

          if (holidayLabel) {
            holidayTotal += 1;
          }
          if (rest) {
            restTotal += 1;
          }
          if (isOfficialWorkday) {
            makeupTotal += 1;
          }
          const isOverlap = rest && (Boolean(holidayLabel) || isWeekend);

          if (isOverlap) {
            overlapTotal += 1;
          }

          const dayNode = document.createElement("div");
          dayNode.className = "day";

          if (holidayLabel) {
            dayNode.classList.add("is-holiday");
          }
          if (rest) {
            dayNode.classList.add("is-rest");
          }
          if (isOverlap) {
            dayNode.classList.add("is-overlap");
          }
          if (isOfficialWorkday) {
            dayNode.classList.add("is-makeup");
          }
          if (isToday) {
            dayNode.classList.add("is-today");
          }
          if (isWeekend) {
            dayNode.classList.add("is-weekend");
          }

          const flag = holidayLabel
            ? `<span class="flag holiday">假</span>`
            : isOfficialWorkday
              ? `<span class="flag makeup">班</span>`
              : rest
                ? `<span class="flag rest">休</span>`
                : "";

          const label = holidayLabel || (isOfficialWorkday ? "调休上班" : "");

          dayNode.innerHTML = `
            <div class="day-header">
              <span class="day-number ${isToday ? "today-mark" : ""}">${day}</span>
              ${flag}
            </div>
            <div class="day-label">${label}</div>
          `;

          daysGrid.appendChild(dayNode);
        }

        while (daysGrid.children.length % 7 !== 0) {
          const emptyNode = document.createElement("div");
          emptyNode.className = "day empty";
          daysGrid.appendChild(emptyNode);
        }

        monthNode.appendChild(daysGrid);
        monthsNode.appendChild(monthNode);

        holidayCount.textContent = String(holidayTotal);
        restCount.textContent = String(restTotal);
        makeupCount.textContent = String(makeupTotal);
        overlapCount.textContent = String(overlapTotal);

        saveSettings(settings);
        renderOfficialSummary(settings, holidayMap, workdaySet);
      }

      const initialSettings = loadSettings();
      const viewState = {
        month: clampMonth(Number.isInteger(initialSettings.viewMonth) ? initialSettings.viewMonth : new Date().getMonth())
      };

      async function initializePage() {
        const redirected = await ensureLatestBuild();
        if (redirected) {
          return;
        }

        applyTheme(loadThemePreference());
        fillInputs(initialSettings);
        renderCalendar();
        updateWeatherBadge();
        watchLocationPermission();

        if (window.matchMedia) {
          const media = window.matchMedia("(prefers-color-scheme: dark)");
          media.addEventListener?.("change", (event) => {
            if (!localStorage.getItem(THEME_STORAGE_KEY)) {
              applyTheme(event.matches ? "dark" : "light");
            }
          });
        }
      }

      weatherBadge.addEventListener("click", () => {
        updateWeatherBadge();
      });

      weatherBadge.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          updateWeatherBadge();
        }
      });

      themeToggle.addEventListener("click", () => {
        toggleTheme();
      });

      applyButton.addEventListener("click", () => {
        renderCalendar();
      });

      yearInput.addEventListener("change", () => {
        const nextYear = Number(yearInput.value) || new Date().getFullYear();
        yearInput.value = nextYear;

        if (!cycleStartInput.value) {
          cycleStartInput.value = `${nextYear}-01-01`;
        }

        renderCalendar();
      });

      prevMonthButton.addEventListener("click", () => {
        shiftMonth(-1);
      });

      nextMonthButton.addEventListener("click", () => {
        shiftMonth(1);
      });

      todayMonthButton.addEventListener("click", () => {
        const now = new Date();
        yearInput.value = now.getFullYear();
        viewState.month = now.getMonth();
        renderCalendar();
      });

      initializePage();
    </script>
  </body>
</html>
