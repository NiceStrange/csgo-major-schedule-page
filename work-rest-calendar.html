<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>节假日与休息日日历</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");
      :root {
        --bg: #f2f2f7;
        --bg-strong: #e9e9ef;
        --paper: rgba(255, 255, 255, 0.78);
        --paper-strong: rgba(255, 255, 255, 0.92);
        --paper-solid: #ffffff;
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --line: rgba(60, 60, 67, 0.12);
        --line-strong: rgba(60, 60, 67, 0.18);
        --accent: #0a84ff;
        --accent-deep: #0066cc;
        --accent-soft: rgba(10, 132, 255, 0.12);
        --weekend: rgba(90, 119, 255, 0.14);
        --weekend-ink: #4f63d8;
        --holiday: rgba(255, 159, 10, 0.16);
        --holiday-ink: #b05a00;
        --rest: rgba(68, 203, 143, 0.16);
        --rest-ink: #1e7e5f;
        --mix: rgba(183, 94, 255, 0.2);
        --mix-ink: #7d3fd6;
        --makeup: rgba(255, 99, 88, 0.16);
        --makeup-ink: #c34235;
        --today: #0a84ff;
        --shadow: 0 28px 72px rgba(29, 29, 31, 0.12);
        --shadow-soft: 0 12px 30px rgba(29, 29, 31, 0.07);
        --hero-sheen: linear-gradient(120deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.16) 42%, rgba(255, 255, 255, 0.52) 100%);
        --ease-fluid: cubic-bezier(0.32, 0.72, 0, 1);
        --ease-lift: cubic-bezier(0.22, 1, 0.36, 1);
      }

      body.dark-theme {
        --bg: #08090c;
        --bg-strong: #020305;
        --paper: rgba(11, 13, 17, 0.82);
        --paper-strong: rgba(18, 20, 25, 0.96);
        --paper-solid: #111318;
        --ink: #f5f7fb;
        --muted: #99a2b2;
        --line: rgba(255, 255, 255, 0.07);
        --line-strong: rgba(255, 255, 255, 0.12);
        --accent: #9ec0ff;
        --accent-deep: #dbe7ff;
        --accent-soft: rgba(112, 137, 255, 0.14);
        --weekend: rgba(96, 118, 255, 0.12);
        --weekend-ink: #b7c3ff;
        --holiday: rgba(255, 171, 74, 0.12);
        --holiday-ink: #ffd4a4;
        --rest: rgba(73, 204, 155, 0.12);
        --rest-ink: #c8f0de;
        --mix: rgba(192, 119, 255, 0.16);
        --mix-ink: #e5c9ff;
        --makeup: rgba(255, 112, 105, 0.12);
        --makeup-ink: #ffc4bf;
        --today: #9bb7ff;
        --shadow: 0 30px 80px rgba(0, 0, 0, 0.46);
        --shadow-soft: 0 16px 36px rgba(0, 0, 0, 0.28);
        --hero-sheen: linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 34%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "Plus Jakarta Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 0%, rgba(137, 178, 255, 0.18), transparent 28%),
          radial-gradient(circle at 100% 8%, rgba(202, 210, 224, 0.18), transparent 26%),
          radial-gradient(circle at 52% 100%, rgba(255, 255, 255, 0.7), transparent 36%),
          linear-gradient(180deg, #fbfbfd 0%, var(--bg) 38%, var(--bg-strong) 100%);
        overflow-x: hidden;
        transition: background 480ms var(--ease-fluid), color 260ms var(--ease-fluid);
      }

      body.dark-theme {
        color-scheme: dark;
        background:
          radial-gradient(circle at 12% 0%, rgba(88, 108, 255, 0.18), transparent 30%),
          radial-gradient(circle at 100% 8%, rgba(48, 158, 137, 0.12), transparent 26%),
          radial-gradient(circle at 50% 100%, rgba(139, 95, 255, 0.1), transparent 34%),
          linear-gradient(180deg, #101116 0%, #090a0d 42%, var(--bg-strong) 100%);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: auto;
        width: 340px;
        height: 340px;
        border-radius: 999px;
        filter: blur(60px);
        pointer-events: none;
        opacity: 0.55;
        z-index: 0;
      }

      body::before {
        top: -80px;
        right: -90px;
        background: rgba(0, 113, 227, 0.18);
        animation: floatBlobOne 18s var(--ease-fluid) infinite;
      }

      body::after {
        bottom: -120px;
        left: -80px;
        background: rgba(175, 82, 222, 0.14);
        animation: floatBlobTwo 24s var(--ease-fluid) infinite;
      }

      body.dark-theme::before {
        background: rgba(97, 119, 255, 0.22);
        opacity: 0.18;
      }

      body.dark-theme::after {
        background: rgba(74, 195, 168, 0.14);
        opacity: 0.14;
      }

      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: 0.038;
        background-image:
          radial-gradient(rgba(20, 24, 32, 0.18) 0.6px, transparent 0.6px),
          radial-gradient(rgba(255, 255, 255, 0.3) 0.6px, transparent 0.6px);
        background-position: 0 0, 12px 12px;
        background-size: 24px 24px;
        mix-blend-mode: soft-light;
      }

      body.dark-theme .grain {
        opacity: 0.034;
        mix-blend-mode: screen;
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(1380px, calc(100% - 36px));
        margin: 24px auto 44px;
      }

      .shell-rim {
        position: relative;
        padding: 2px;
        border-radius: 38px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(219, 223, 230, 0.68)),
          rgba(255, 255, 255, 0.42);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.88),
          0 26px 54px rgba(27, 31, 38, 0.08);
      }

      .shell-rim > * {
        border-radius: inherit;
      }

      body.dark-theme .shell-rim {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02)),
          linear-gradient(180deg, rgba(18, 20, 25, 0.98), rgba(8, 10, 13, 0.98));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          inset 0 -1px 0 rgba(255, 255, 255, 0.02),
          0 30px 80px rgba(0, 0, 0, 0.45);
      }

      .hero {
        position: relative;
        padding: 24px 24px 26px;
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: 34px;
        background:
          radial-gradient(circle at 85% 20%, rgba(255, 255, 255, 0.68), transparent 24%),
          linear-gradient(145deg, rgba(255, 255, 255, 0.94), rgba(252, 253, 255, 0.78) 52%, rgba(244, 246, 251, 0.72)),
          var(--paper);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.86),
          0 18px 38px rgba(38, 44, 53, 0.08);
        overflow: hidden;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--hero-sheen);
        opacity: 0.42;
        pointer-events: none;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.9), transparent 62%);
      }

      .hero-top {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .hero-actions {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
      }

      .traffic-lights {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .traffic-lights span {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      .traffic-lights span:nth-child(1) {
        background: #ff5f57;
      }

      .traffic-lights span:nth-child(2) {
        background: #febc2e;
      }

      .traffic-lights span:nth-child(3) {
        background: #28c840;
      }

      .hero-badge {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.68);
        border: 1px solid rgba(60, 60, 67, 0.08);
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        user-select: none;
        transition: transform 380ms var(--ease-fluid), color 260ms var(--ease-fluid), border-color 260ms var(--ease-fluid), background 260ms var(--ease-fluid), box-shadow 380ms var(--ease-fluid);
      }

      .hero-badge::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(180deg, #34c759, #1ea94b);
        box-shadow: 0 0 0 4px rgba(52, 199, 89, 0.12);
        animation: pulseDot 2.6s var(--ease-fluid) infinite;
      }

      .hero-badge:hover {
        transform: translateY(-1px);
        color: var(--accent);
        border-color: rgba(10, 132, 255, 0.18);
        background: rgba(255, 255, 255, 0.78);
      }

      .theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 7px 12px 7px 8px;
        border-radius: 999px;
        border: 1px solid rgba(60, 60, 67, 0.08);
        background: rgba(255, 255, 255, 0.64);
        color: var(--muted);
        font: inherit;
        font-size: 0.79rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
        transition:
          transform 380ms var(--ease-fluid),
          box-shadow 380ms var(--ease-fluid),
          color 260ms var(--ease-fluid),
          border-color 260ms var(--ease-fluid),
          background 260ms var(--ease-fluid);
      }

      .theme-toggle:hover {
        transform: translateY(-1px);
        color: var(--ink);
        border-color: rgba(10, 132, 255, 0.16);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.78),
          0 10px 20px rgba(29, 29, 31, 0.08);
      }

      .theme-toggle:focus-visible {
        outline: none;
        box-shadow:
          0 0 0 4px rgba(10, 132, 255, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.78);
      }

      .theme-toggle-track {
        position: relative;
        width: 34px;
        height: 20px;
        border-radius: 999px;
        background: rgba(120, 120, 128, 0.28);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);
        transition: background 260ms var(--ease-fluid);
      }

      .theme-toggle-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffffff, #f2f2f7);
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.82);
        transition: transform 300ms var(--ease-fluid), background 300ms var(--ease-fluid);
      }

      body.dark-theme .theme-toggle-thumb {
        transform: translateX(14px);
        background: linear-gradient(180deg, #f5f5f7, #d7d7de);
      }

      .hero-badge:focus-visible {
        outline: none;
        box-shadow:
          0 0 0 4px rgba(10, 132, 255, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.72);
      }

      .hero h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(2.8rem, 5vw, 5.1rem);
        font-weight: 800;
        line-height: 0.9;
        letter-spacing: -0.08em;
        text-wrap: balance;
      }

      .hero-grid {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(260px, 0.75fr);
        gap: 26px;
        align-items: end;
      }

      .hero-intro {
        display: grid;
        gap: 14px;
      }

      .hero-kicker {
        display: inline-flex;
        align-items: center;
        align-self: start;
        width: fit-content;
        padding: 7px 12px;
        border-radius: 999px;
        border: 1px solid rgba(60, 60, 67, 0.08);
        background: rgba(255, 255, 255, 0.78);
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .hero-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .hero-pill {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid rgba(60, 60, 67, 0.08);
        background: rgba(255, 255, 255, 0.76);
        color: color-mix(in srgb, var(--ink) 78%, transparent);
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .hero-preview {
        display: flex;
        justify-content: flex-end;
      }

      .hero-preview-card {
        width: min(100%, 320px);
        padding: 20px 20px 18px;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.82);
        background:
          radial-gradient(circle at 100% 0%, rgba(255, 255, 255, 0.66), transparent 34%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(250, 251, 254, 0.68)),
          rgba(255, 255, 255, 0.44);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.88),
          0 18px 34px rgba(29, 29, 31, 0.08);
      }

      .hero-preview-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .hero-preview-label {
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .hero-preview-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(180deg, #34c759, #29a649);
        box-shadow: 0 0 0 6px rgba(52, 199, 89, 0.12);
      }

      .hero-preview-value {
        display: block;
        font-size: clamp(1.7rem, 3vw, 2.35rem);
        font-weight: 800;
        letter-spacing: -0.06em;
      }

      .hero-preview-meta {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .hero p {
        margin: 16px 0 0;
        max-width: 760px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.75;
      }

      .layout {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 22px;
        margin-top: 18px;
        align-items: start;
      }

      .panel,
      .calendar-board {
        border: 1px solid rgba(255, 255, 255, 0.74);
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(248, 250, 254, 0.74)),
          var(--paper);
        box-shadow: var(--shadow);
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        align-self: start;
        position: sticky;
        top: 16px;
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
      }

      .section {
        position: relative;
        padding: 18px;
        border-radius: 26px;
        border: 1px solid rgba(255, 255, 255, 0.7);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(247, 249, 252, 0.72));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 14px 28px rgba(31, 34, 40, 0.04);
        transition:
          transform 420ms var(--ease-fluid),
          box-shadow 420ms var(--ease-fluid),
          border-color 260ms var(--ease-fluid);
      }

      .section::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.28), transparent 46%);
        pointer-events: none;
      }

      .section:hover {
        transform: translateY(-1px);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.72),
          0 10px 22px rgba(29, 29, 31, 0.05);
        border-color: rgba(255, 255, 255, 0.82);
      }

      .section + .section {
        margin-top: 0;
      }

      .section-head {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
      }

      .section-cap {
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .section h2 {
        margin: 0;
        font-size: 1.06rem;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .field-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field label {
        display: block;
        margin-bottom: 7px;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--muted);
      }

      .field input,
      .field textarea,
      .field button {
        width: 100%;
        border-radius: 18px;
        border: 1px solid rgba(15, 23, 42, 0.06);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(247, 249, 253, 0.96));
        color: var(--ink);
        font: inherit;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.82),
          0 8px 18px rgba(25, 28, 34, 0.04);
      }

      .field input,
      .field textarea {
        padding: 14px 16px;
        transition: border-color 260ms var(--ease-fluid), box-shadow 380ms var(--ease-fluid), transform 380ms var(--ease-fluid);
      }

      .field input:focus,
      .field textarea:focus {
        outline: none;
        border-color: rgba(0, 113, 227, 0.35);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.7),
          0 0 0 4px rgba(10, 132, 255, 0.12);
      }

      .field textarea {
        min-height: 184px;
        resize: vertical;
        line-height: 1.6;
      }

      .button-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 16px;
      }

      .button-row button {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        flex: 1 1 140px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 58px;
        padding: 12px 14px 12px 18px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 999px;
        font-weight: 700;
        letter-spacing: -0.01em;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(244, 247, 252, 0.94)),
          rgba(255, 255, 255, 0.9);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.92),
          0 14px 28px rgba(24, 28, 34, 0.06);
        transition:
          transform 420ms var(--ease-fluid),
          box-shadow 420ms var(--ease-fluid),
          filter 260ms var(--ease-fluid),
          background 260ms var(--ease-fluid),
          border-color 260ms var(--ease-fluid),
          color 260ms var(--ease-fluid);
      }

      .button-row button::before {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.58), rgba(255, 255, 255, 0));
        opacity: 0.82;
        pointer-events: none;
      }

      .primary {
        color: var(--ink);
        border-color: rgba(86, 102, 130, 0.14);
      }

      .button-copy {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: inherit;
        font-size: 0.94rem;
      }

      .button-orb {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 999px;
        border: 1px solid rgba(15, 23, 42, 0.06);
        background: linear-gradient(180deg, rgba(32, 37, 45, 0.08), rgba(32, 37, 45, 0.03));
        color: var(--accent-deep);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.78),
          0 4px 14px rgba(22, 28, 36, 0.08);
        transition: transform 420ms var(--ease-fluid), background 260ms var(--ease-fluid), box-shadow 420ms var(--ease-fluid);
      }

      .button-orb svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        stroke-width: 1.75;
        fill: none;
      }

      .ghost {
        background: rgba(255, 255, 255, 0.82);
      }

      .button-row button:hover {
        transform: translateY(-2px) scale(1.004);
        border-color: rgba(118, 132, 163, 0.18);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.96),
          0 20px 34px rgba(24, 28, 34, 0.08);
        filter: saturate(1.03);
      }

      .button-row button:active {
        transform: translateY(1px) scale(0.984);
      }

      .button-row button:hover .button-orb {
        transform: translateX(3px) translateY(-1px) scale(1.05);
        background: linear-gradient(180deg, rgba(10, 132, 255, 0.16), rgba(10, 132, 255, 0.08));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.82),
          0 8px 18px rgba(10, 132, 255, 0.16);
      }

      .legend {
        display: grid;
        gap: 12px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .swatch {
        width: 16px;
        height: 16px;
        border-radius: 6px;

            return false;
          }

          const payload = await response.json();
          const latestVersion = payload.version;
          if (!latestVersion || latestVersion === APP_VERSION) {
            return false;
          }

          const nextUrl = new URL(window.location.href);
          if (nextUrl.searchParams.get("v") !== latestVersion) {
            nextUrl.searchParams.set("v", latestVersion);
            window.location.replace(nextUrl.toString());
            return true;
          }
        } catch (error) {
          // Ignore update-check failures so the calendar still loads offline or on flaky networks.
        }

        return false;
      }

      function formatWeather(city, current) {
        const weatherText = weatherCodeMap[current.weather_code] || "天气正常";
        const temperature = Math.round(current.temperature_2m);
        return `${city} ${temperature}°C ${weatherText}`;
      }

      async function fetchWeather(latitude, longitude, city) {
        const url = new URL("https://api.open-meteo.com/v1/forecast");
        url.searchParams.set("latitude", String(latitude));
        url.searchParams.set("longitude", String(longitude));
        url.searchParams.set("current", "temperature_2m,weather_code");
        url.searchParams.set("timezone", "auto");

        const response = await fetch(url.toString());
        if (!response.ok) {
          throw new Error(`weather ${response.status}`);
        }

        const payload = await response.json();
        if (!payload.current) {
          throw new Error("missing current weather");
        }

        setWeatherBadge(formatWeather(city, payload.current));
      }

      function getCurrentPosition() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error("geolocation unavailable"));
            return;
          }

          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: false,
            timeout: 5000,
            maximumAge: 15 * 60 * 1000
          });
        });
      }

      async function updateWeatherBadge() {
        setWeatherBadge("天气读取中");

        try {
          const position = await getCurrentPosition();
          await fetchWeather(position.coords.latitude, position.coords.longitude, "当前位置");
          return;
        } catch (error) {
          // Ignore and fall back to Shanghai so the badge always shows a weather status.
        }

        try {
          await fetchWeather(31.2304, 121.4737, "上海");
        } catch (error) {
          setWeatherBadge("天气暂不可用");
        }
      }

      async function watchLocationPermission() {
        if (!navigator.permissions || !navigator.permissions.query) {
          return;
        }

        try {
          const permissionStatus = await navigator.permissions.query({ name: "geolocation" });
          permissionStatus.onchange = () => {
            if (permissionStatus.state === "granted") {
              updateWeatherBadge();
            }
          };
        } catch (error) {
          // Some browsers do not support querying geolocation permissions.
        }
      }

      function toDateKey(date) {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      }

      function expandDateRange(startText, endText) {
        const dates = [];
        const cursor = new Date(`${startText}T00:00:00`);
        const end = new Date(`${endText}T00:00:00`);

        while (cursor <= end) {
          dates.push(toDateKey(cursor));
          cursor.setDate(cursor.getDate() + 1);
        }

        return dates;
      }

      function getOfficialSchedule(year) {
        return OFFICIAL_SCHEDULES[year] || null;
      }

      function createOfficialHolidayMap(year) {
        const schedule = getOfficialSchedule(year);
        const map = new Map();

        if (!schedule) {
          return map;
        }

        schedule.holidays.forEach((holiday) => {
          holiday.dates.forEach((date) => {
            map.set(date, holiday.name);
          });
        });

        return map;
      }

      function createOfficialWorkdaySet(year) {
        const schedule = getOfficialSchedule(year);
        return new Set(schedule ? schedule.workdays : []);
      }

      function getDefaultSettings() {
        const now = new Date();
        return {
          year: now.getFullYear(),
          viewMonth: now.getMonth(),
          cycleStart: `${now.getFullYear()}-01-01`,
          workDays: 3,
          restDays: 1
        };
      }

      function loadSettings() {
        const defaults = getDefaultSettings();

        try {
          const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
          if (!raw) {
            return defaults;
          }

          const parsed = JSON.parse(raw);
          return {
            year: Number(parsed.year) || defaults.year,
            viewMonth: Number.isInteger(parsed.viewMonth) ? parsed.viewMonth : defaults.viewMonth,
            cycleStart: parsed.cycleStart || defaults.cycleStart,
            workDays: Number(parsed.workDays) || defaults.workDays,
            restDays: Number(parsed.restDays) || defaults.restDays
          };
        } catch (error) {
          return defaults;
        }
      }

      function saveSettings(settings) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
      }

      function getDateDiffDays(baseDate, targetDate) {
        const millisecondsPerDay = 24 * 60 * 60 * 1000;
        const base = Date.UTC(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
        const target = Date.UTC(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
        return Math.floor((target - base) / millisecondsPerDay);
      }

      function getCyclePosition(targetDate, cycleStartText, workDays, restDays) {
        const cycleStart = new Date(`${cycleStartText}T00:00:00`);
        if (Number.isNaN(cycleStart.getTime())) {
          return null;
        }

        const cycleLength = workDays + restDays;
        if (cycleLength <= 0) {
          return null;
        }

        const diff = getDateDiffDays(cycleStart, targetDate);
        return ((diff % cycleLength) + cycleLength) % cycleLength;
      }

      function isRestDay(targetDate, cycleStartText, workDays, restDays) {
        const position = getCyclePosition(targetDate, cycleStartText, workDays, restDays);
        return position !== null && position >= workDays;
      }

      function getSettingsFromInputs() {
        return {
          year: Number(yearInput.value),
          viewMonth: viewState.month,
          cycleStart: cycleStartInput.value,
          workDays: Number(workDaysInput.value),
          restDays: Number(restDaysInput.value)
        };
      }

      function fillInputs(settings) {
        yearInput.value = settings.year;
        cycleStartInput.value = settings.cycleStart;
        workDaysInput.value = settings.workDays;
        restDaysInput.value = settings.restDays;
      }

      function clampMonth(month) {
        return Math.min(11, Math.max(0, month));
      }

      function setViewMonth(month) {
        viewState.month = clampMonth(month);
      }

      function setupRevealObserver() {
        const revealNodes = document.querySelectorAll(".reveal");

        if (!("IntersectionObserver" in window)) {
          revealNodes.forEach((node) => node.classList.add("is-visible"));
          return;
        }

        if (revealObserver) {
          revealObserver.disconnect();
        }

        revealObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) {
                return;
              }

              entry.target.classList.add("is-visible");
              revealObserver.unobserve(entry.target);
            });
          },
          {
            threshold: 0.14,
            rootMargin: "0px 0px -8% 0px"
          }
        );

        revealNodes.forEach((node, index) => {
          node.style.setProperty("--reveal-delay", `${Math.min(index * 48, 240)}ms`);
          revealObserver.observe(node);
        });
      }

      function shiftMonth(step) {
        let year = Number(yearInput.value) || new Date().getFullYear();
        let month = viewState.month + step;

        if (month < 0) {
          month = 11;
          year -= 1;
        } else if (month > 11) {
          month = 0;
          year += 1;
        }

        yearInput.value = year;
        setViewMonth(month);
        renderCalendar();
      }

      function renderCalendar() {
        const settings = getSettingsFromInputs();
        const holidayMap = createOfficialHolidayMap(settings.year);
        const workdaySet = createOfficialWorkdaySet(settings.year);
        const todayKey = toDateKey(new Date());
        const activeMonth = clampMonth(settings.viewMonth);

        let holidayTotal = 0;
        let restTotal = 0;
        let makeupTotal = 0;
        let overlapTotal = 0;

        calendarTitle.textContent = `${settings.year} 年 ${monthNames[activeMonth]}`;
        calendarSubtitle.textContent = `休息周期 上${settings.workDays}休${settings.restDays} · 法定节假日自动同步`;

        monthChip.textContent = `${settings.year}.${pad(activeMonth + 1)}`;
        heroMonth.textContent = `${settings.year} 年 ${monthNames[activeMonth]}`;
        heroCycle.textContent = `周期 上${settings.workDays}休${settings.restDays} · 周末与法定节假日重叠自动高亮`;
        monthsNode.innerHTML = "";

        const firstDay = new Date(settings.year, activeMonth, 1);
        const daysInMonth = new Date(settings.year, activeMonth + 1, 0).getDate();
        const startWeekday = (firstDay.getDay() + 6) % 7;

        const monthNode = document.createElement("section");
        monthNode.className = "month reveal";

        const monthHead = document.createElement("div");
        monthHead.className = "month-head";
        monthHead.innerHTML = `<h3>${monthNames[activeMonth]}</h3><span>${settings.year}.${pad(activeMonth + 1)}</span>`;
        monthNode.appendChild(monthHead);

        const weekdayRow = document.createElement("div");
        weekdayRow.className = "weekdays";
        weekdayNames.forEach((weekday, weekdayIndex) => {
          const node = document.createElement("div");
          node.textContent = weekday;
          if (weekdayIndex === 5 || weekdayIndex === 6) {
            node.classList.add("is-weekend");
          }
          weekdayRow.appendChild(node);
        });
        monthNode.appendChild(weekdayRow);

        const daysGrid = document.createElement("div");
        daysGrid.className = "days";

        for (let index = 0; index < startWeekday; index += 1) {
          const emptyNode = document.createElement("div");
          emptyNode.className = "day empty";
          daysGrid.appendChild(emptyNode);
        }

        for (let day = 1; day <= daysInMonth; day += 1) {
          const currentDate = new Date(settings.year, activeMonth, day);
          const dateKey = toDateKey(currentDate);
          const holidayLabel = holidayMap.get(dateKey);
          const isOfficialWorkday = workdaySet.has(dateKey);
          const rest = !isOfficialWorkday && isRestDay(currentDate, settings.cycleStart, settings.workDays, settings.restDays);
          const isToday = dateKey === todayKey;
          const isWeekend = currentDate.getDay() === 0 || currentDate.getDay() === 6;

          if (holidayLabel) {
            holidayTotal += 1;
          }
          if (rest) {
            restTotal += 1;
          }
          if (isOfficialWorkday) {
            makeupTotal += 1;
          }
          const isOverlap = rest && (Boolean(holidayLabel) || isWeekend);

          if (isOverlap) {
            overlapTotal += 1;
          }

          const dayNode = document.createElement("div");
          dayNode.className = "day";

          if (holidayLabel) {
            dayNode.classList.add("is-holiday");
          }
          if (rest) {
            dayNode.classList.add("is-rest");
          }
          if (isOverlap) {
            dayNode.classList.add("is-overlap");
          }
          if (isOfficialWorkday) {
            dayNode.classList.add("is-makeup");
          }
          if (isToday) {
            dayNode.classList.add("is-today");
          }
          if (isWeekend) {
            dayNode.classList.add("is-weekend");
          }
          if (currentDate.getDay() === 6) {
            dayNode.classList.add("is-saturday");
          }
          if (currentDate.getDay() === 0) {
            dayNode.classList.add("is-sunday");
          }

          const flag = holidayLabel
            ? `<span class="flag holiday">假</span>`
            : isOfficialWorkday
              ? `<span class="flag makeup">班</span>`
              : rest
                ? `<span class="flag rest">休</span>`
                : "";

          const label = holidayLabel || (isOfficialWorkday ? "调休上班" : "");

          dayNode.innerHTML = `
            <div class="day-header">
              <span class="day-number ${isToday ? "today-mark" : ""}">${day}</span>
              ${flag}
            </div>
            <div class="day-label">${label}</div>
          `;

          daysGrid.appendChild(dayNode);
        }

        while (daysGrid.children.length % 7 !== 0) {
          const emptyNode = document.createElement("div");
          emptyNode.className = "day empty";
          daysGrid.appendChild(emptyNode);
        }

        monthNode.appendChild(daysGrid);
        monthsNode.appendChild(monthNode);

        holidayCount.textContent = String(holidayTotal);
        restCount.textContent = String(restTotal);
        makeupCount.textContent = String(makeupTotal);
        overlapCount.textContent = String(overlapTotal);

        saveSettings(settings);
        requestAnimationFrame(setupRevealObserver);
      }

      const initialSettings = loadSettings();
      const viewState = {
        month: clampMonth(Number.isInteger(initialSettings.viewMonth) ? initialSettings.viewMonth : new Date().getMonth())
      };

      async function initializePage() {
        const redirected = await ensureLatestBuild();
        if (redirected) {
          return;
        }

        applyTheme(loadThemePreference());
        fillInputs(initialSettings);
        renderCalendar();
        updateWeatherBadge();
        watchLocationPermission();

        if (window.matchMedia) {
          const media = window.matchMedia("(prefers-color-scheme: dark)");
          media.addEventListener?.("change", (event) => {
            if (!localStorage.getItem(THEME_STORAGE_KEY)) {
              applyTheme(event.matches ? "dark" : "light");
            }
          });
        }
      }

      weatherBadge.addEventListener("click", () => {
        updateWeatherBadge();
      });

      weatherBadge.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          updateWeatherBadge();
        }
      });

      themeToggle.addEventListener("click", () => {
        toggleTheme();
      });

      applyButton.addEventListener("click", () => {
        renderCalendar();
      });

      yearInput.addEventListener("change", () => {
        const nextYear = Number(yearInput.value) || new Date().getFullYear();
        yearInput.value = nextYear;

        if (!cycleStartInput.value) {
          cycleStartInput.value = `${nextYear}-01-01`;
        }

        renderCalendar();
      });

      prevMonthButton.addEventListener("click", () => {
        shiftMonth(-1);
      });

      nextMonthButton.addEventListener("click", () => {
        shiftMonth(1);
      });

      todayMonthButton.addEventListener("click", () => {
        const now = new Date();
        yearInput.value = now.getFullYear();
        viewState.month = now.getMonth();
        renderCalendar();
      });

      initializePage();
    </script>
  </body>
</html>
