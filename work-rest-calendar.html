<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Eunice的日历</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;600;700&display=swap");

      :root {
        --ease: cubic-bezier(0.32, 0.72, 0, 1);
        --app-width: min(1540px, calc(100vw - 48px));
        --shell-radius: 30px;
        --panel-radius: 25px;
        --cell-radius: 18px;
        --body-bg:
          radial-gradient(circle at 10% 16%, rgba(55, 97, 184, 0.24), transparent 24%),
          radial-gradient(circle at 88% 14%, rgba(64, 114, 225, 0.18), transparent 20%),
          radial-gradient(circle at 16% 84%, rgba(42, 82, 172, 0.16), transparent 28%),
          linear-gradient(180deg, #111a2d 0%, #182742 42%, #1d3152 100%);
        --surface:
          linear-gradient(180deg, rgba(17, 24, 37, 0.97), rgba(12, 18, 29, 0.98));
        --surface-soft:
          linear-gradient(180deg, rgba(26, 34, 50, 0.94), rgba(15, 21, 32, 0.98));
        --surface-subtle:
          linear-gradient(180deg, rgba(29, 37, 53, 0.92), rgba(17, 24, 34, 0.96));
        --surface-ribbon:
          linear-gradient(180deg, rgba(153, 156, 162, 0.94), rgba(105, 108, 115, 0.92) 46%, rgba(66, 70, 79, 0.96));
        --border: rgba(188, 208, 255, 0.12);
        --border-soft: rgba(255, 255, 255, 0.06);
        --text: #f4f7fd;
        --text-soft: rgba(232, 239, 255, 0.82);
        --text-mute: rgba(202, 213, 236, 0.46);
        --text-faint: rgba(190, 200, 219, 0.28);
        --shadow-panel:
          0 22px 46px rgba(4, 8, 16, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
        --shadow-soft:
          0 10px 24px rgba(4, 8, 16, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
        --weekend-bg: linear-gradient(180deg, rgba(50, 58, 99, 0.92), rgba(34, 41, 74, 0.96));
        --holiday-bg: linear-gradient(180deg, rgba(62, 74, 117, 0.94), rgba(41, 50, 84, 0.98));
        --rest-bg: linear-gradient(180deg, rgba(22, 49, 59, 0.96), rgba(18, 36, 45, 0.98));
        --overlap-bg: linear-gradient(180deg, rgba(69, 77, 128, 0.98), rgba(47, 54, 97, 1));
        --makeup-bg: linear-gradient(180deg, rgba(46, 59, 100, 0.96), rgba(35, 45, 78, 0.98));
        --saturday: #6f8cff;
        --sunday: #f06a84;
        --accent-green: #6fd9a5;
        --accent-blue: #9ab8ff;
        --today-outline: rgba(218, 229, 255, 0.84);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Plus Jakarta Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: var(--body-bg);
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 10%),
          radial-gradient(circle at 80% 62%, rgba(141, 178, 255, 0.08), transparent 24%);
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .app-shell {
        width: var(--app-width);
        margin: 24px auto 18px;
        position: relative;
        z-index: 1;
      }

      .frame {
        position: relative;
        border-radius: var(--shell-radius);
        border: 1px solid var(--border);
        background: var(--surface);
        box-shadow: var(--shadow-panel);
      }

      .frame::before {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: inherit;
        border: 1px solid var(--border-soft);
        pointer-events: none;
      }

      .hero {
        min-height: 156px;
        padding: 28px 26px 22px 42px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        align-items: center;
        overflow: hidden;
      }

      .window-dots {
        position: absolute;
        top: 16px;
        left: 20px;
        display: flex;
        gap: 10px;
      }

      .window-dots span {
        width: 12px;
        height: 12px;
        border-radius: 999px;
      }

      .window-dots span:nth-child(1) { background: #ff6057; }
      .window-dots span:nth-child(2) { background: #ffbd2e; }
      .window-dots span:nth-child(3) { background: #28ca42; }

      .hero-copy {
        position: relative;
        z-index: 1;
      }

      .hero h1 {
        margin: 0;
        font-family: "Noto Serif SC", "Times New Roman", serif;
        font-size: 3.68rem;
        line-height: 1;
        letter-spacing: -0.07em;
        font-weight: 600;
        color: #f4f7ff;
      }

      .hero-subtitle {
        margin: 10px 0 0;
        color: rgba(220, 228, 247, 0.72);
        font-size: 0.9rem;
        letter-spacing: -0.01em;
      }

      .hero-controls {
        position: relative;
        z-index: 1;
        justify-self: end;
        width: 386px;
        padding: 9px;
        border-radius: 20px;
        border: 1px solid rgba(178, 194, 229, 0.12);
        background: linear-gradient(180deg, rgba(35, 43, 59, 0.74), rgba(17, 24, 37, 0.92));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.04),
          0 18px 32px rgba(3, 6, 13, 0.16);
        display: grid;
        grid-template-columns: 1fr 176px;
        grid-template-areas:
          "location theme"
          "weather style";
        gap: 8px;
      }

      .hero-pill {
        min-height: 38px;
        border-radius: 16px;
        border: 1px solid rgba(180, 197, 233, 0.1);
        background: linear-gradient(180deg, rgba(29, 36, 52, 0.92), rgba(20, 27, 39, 0.98));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        transition:
          transform 260ms var(--ease),
          border-color 260ms var(--ease),
          background 260ms var(--ease);
      }

      .hero-pill:hover {
        transform: translateY(-1px);
        border-color: rgba(213, 225, 250, 0.16);
      }

      .control-chip,
      .theme-toggle,
      .style-toggle {
        width: 100%;
      }

      .control-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 13px;
        font-size: 0.84rem;
        font-weight: 600;
        cursor: pointer;
      }

      .control-chip svg {
        width: 14px;
        height: 14px;
        stroke: rgba(215, 227, 250, 0.66);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: 0 0 auto;
      }

      .control-location {
        grid-area: location;
        color: rgba(233, 240, 255, 0.84);
      }

      .control-weather {
        grid-area: weather;
        justify-content: flex-start;
        gap: 10px;
      }

      .control-weather strong {
        font-size: 0.94rem;
      }

      .weather-copy {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }

      .weather-copy span {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: var(--accent-green);
        box-shadow: 0 0 0 4px rgba(111, 217, 165, 0.12);
      }

      .theme-toggle {
        grid-area: theme;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 13px;
        cursor: pointer;
      }

      .toggle-label {
        font-size: 0.85rem;
        font-weight: 700;
        color: rgba(244, 247, 255, 0.78);
      }

      .toggle-track {
        width: 34px;
        height: 20px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(208, 221, 249, 0.08);
        position: relative;
        flex: 0 0 auto;
      }

      .toggle-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(213, 221, 238, 0.92));
        box-shadow:
          0 4px 10px rgba(0, 0, 0, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.62);
        transition: transform 260ms var(--ease);
      }

      .light-theme .toggle-thumb {
        transform: translateX(14px);
      }

      .style-toggle {
        grid-area: style;
        min-height: 38px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 8px 0 13px;
        cursor: pointer;
      }

      .style-copy {
        display: grid;
        gap: 1px;
        text-align: left;
      }

      .style-copy small {
        font-size: 0.52rem;
        letter-spacing: 0.18em;
        color: rgba(224, 231, 246, 0.36);
        text-transform: uppercase;
      }

      .style-copy span {
        font-size: 0.92rem;
        font-weight: 700;
      }

      .style-orb {
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        border-radius: 999px;
        background:
          radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.8), transparent 18%),
          radial-gradient(circle at 64% 66%, rgba(178, 199, 250, 0.42), transparent 46%),
          linear-gradient(180deg, rgba(161, 169, 192, 0.88), rgba(85, 93, 119, 0.96));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.4),
          0 6px 18px rgba(3, 6, 13, 0.22);
      }

      .content {
        margin-top: 20px;
        display: grid;
        grid-template-columns: 298px minmax(0, 1fr);
        gap: 20px;
        align-items: stretch;
      }

      .sidebar,
      .calendar-shell {
        min-height: 800px;
        padding: 18px;
      }

      .sidebar-stack {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 16px;
      }

      .subpanel {
        border-radius: var(--panel-radius);
        border: 1px solid rgba(189, 208, 246, 0.1);
        background: var(--surface-soft);
        box-shadow: var(--shadow-soft);
        padding: 18px 16px 16px;
      }

      .subpanel-header {
        margin-bottom: 14px;
      }

      .subpanel-header small {
        display: block;
        color: rgba(219, 228, 245, 0.42);
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .subpanel-header h2 {
        margin: 5px 0 0;
        font-size: 1.05rem;
        line-height: 1.1;
      }

      .field-stack {
        display: grid;
        gap: 10px;
      }

      .field label {
        display: block;
        margin-bottom: 7px;
        font-size: 0.76rem;
        color: rgba(235, 240, 250, 0.7);
      }

      .input-wrap {
        position: relative;
      }

      .field input {
        width: 100%;
        height: 68px;
        padding: 0 46px 0 16px;
        border-radius: 18px;
        border: 1px solid rgba(207, 220, 247, 0.08);
        outline: none;
        color: var(--text);
        background: linear-gradient(180deg, rgba(24, 31, 45, 0.92), rgba(18, 24, 35, 0.98));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .field input:focus {
        border-color: rgba(218, 228, 250, 0.16);
      }

      .field-icon {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(234, 241, 255, 0.74);
        font-size: 1rem;
        pointer-events: none;
      }

      .apply-button {
        width: 100%;
        margin-top: 14px;
        height: 54px;
        border: 0;
        padding: 0 14px 0 18px;
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(36, 44, 61, 0.92), rgba(17, 24, 36, 0.98));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        transition: transform 260ms var(--ease);
      }

      .apply-button:hover {
        transform: translateY(-1px);
      }

      .apply-button strong {
        font-size: 0.98rem;
      }

      .apply-button .orb {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, rgba(57, 71, 108, 0.92), rgba(31, 42, 69, 0.98));
        border: 1px solid rgba(212, 224, 252, 0.08);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .apply-button svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }

      .legend-panel {
        display: flex;
        flex-direction: column;
      }

      .legend {
        display: grid;
        gap: 12px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 12px;
        color: rgba(232, 238, 251, 0.72);
        font-size: 0.95rem;
      }

      .legend-dot {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        border: 1px solid rgba(225, 234, 252, 0.12);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .legend-weekend { background: linear-gradient(180deg, rgba(79, 97, 168, 0.92), rgba(56, 71, 126, 0.96)); }
      .legend-holiday { background: linear-gradient(180deg, rgba(88, 109, 176, 0.92), rgba(61, 78, 136, 0.96)); }
      .legend-makeup { background: linear-gradient(180deg, rgba(74, 94, 158, 0.92), rgba(49, 64, 110, 0.96)); }
      .legend-rest { background: linear-gradient(180deg, rgba(42, 87, 95, 0.92), rgba(28, 60, 66, 0.98)); }
      .legend-overlap { background: linear-gradient(180deg, rgba(104, 110, 189, 0.95), rgba(69, 78, 134, 0.98)); }

      .calendar-shell {
        padding: 18px 22px 18px;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        gap: 18px;
      }

      .calendar-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 0;
      }

      .calendar-title-wrap h2 {
        margin: 2px 0 0;
        font-family: "Noto Serif SC", "Times New Roman", serif;
        font-size: 2.02rem;
        line-height: 1.02;
        letter-spacing: -0.05em;
        font-weight: 600;
      }

      .month-switcher {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        border-radius: 18px;
        border: 1px solid rgba(194, 208, 241, 0.08);
        background: linear-gradient(180deg, rgba(29, 36, 51, 0.92), rgba(20, 26, 37, 0.98));
      }

      .switch-button,
      .switch-label,
      .switch-today {
        height: 38px;
        border: 0;
        border-radius: 14px;
        background: transparent;
        color: rgba(246, 249, 255, 0.9);
      }

      .switch-button {
        width: 44px;
        font-size: 1.42rem;
        cursor: pointer;
      }

      .switch-label {
        min-width: 116px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        font-size: 0.96rem;
        font-weight: 600;
      }

      .switch-today {
        min-width: 58px;
        padding: 0 18px;
        font-size: 0.96rem;
        font-weight: 600;
        cursor: pointer;
      }

      .stats {
        margin-top: 0;
        display: grid;
        grid-template-columns: 2.2fr 1fr 1fr 1fr;
        gap: 14px;
      }

      .stat-card {
        min-height: 70px;
        border-radius: 18px;
        border: 1px solid rgba(194, 208, 241, 0.1);
        background: linear-gradient(180deg, rgba(24, 31, 45, 0.94), rgba(16, 22, 33, 0.98));
        box-shadow: var(--shadow-soft);
        padding: 0 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
      }

      .stat-value {
        font-size: 3rem;
        line-height: 1;
        font-weight: 500;
        letter-spacing: -0.06em;
      }

      .stat-label {
        font-size: 0.98rem;
        color: rgba(243, 247, 255, 0.8);
      }

      .stat-note {
        font-size: 0.7rem;
        color: rgba(205, 214, 230, 0.44);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .calendar-stage {
        min-height: 0;
        border-radius: 24px;
        border: 1px solid rgba(194, 208, 241, 0.08);
        background: linear-gradient(180deg, rgba(20, 28, 42, 0.92), rgba(13, 19, 28, 0.98));
        padding: 10px 10px 12px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 8px;
      }

      .weekdays,
      .days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }

      .weekdays {
        padding: 0 4px;
      }

      .weekdays div {
        text-align: center;
        font-size: 0.86rem;
        font-weight: 700;
        color: rgba(234, 240, 250, 0.68);
      }

      .weekdays .is-weekend {
        color: #89a0ff;
      }

      .days {
        --week-count: 5;
        gap: 8px;
        min-height: 0;
        grid-template-rows: repeat(var(--week-count), minmax(0, 1fr));
      }

      .day {
        position: relative;
        min-height: 0;
        border-radius: var(--cell-radius);
        border: 1px solid rgba(195, 210, 245, 0.1);
        background: linear-gradient(180deg, rgba(22, 29, 43, 0.96), rgba(16, 22, 32, 0.98));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.03),
          0 6px 16px rgba(4, 8, 16, 0.08);
        padding: 13px 12px 10px;
        display: grid;
        grid-template-rows: 16px 1fr auto;
        align-items: center;
        justify-items: center;
        transition:
          transform 260ms var(--ease),
          border-color 260ms var(--ease);
      }

      .day:hover {
        transform: translateY(-1px);
        border-color: rgba(221, 231, 251, 0.14);
      }

      .day.empty {
        background: transparent;
        border-color: transparent;
        box-shadow: none;
      }

      .day.is-rest { background: var(--rest-bg); }
      .day.is-weekend:not(.is-rest):not(.is-holiday):not(.is-overlap):not(.is-makeup) { background: var(--weekend-bg); }
      .day.is-holiday:not(.is-overlap) { background: var(--holiday-bg); }
      .day.is-overlap { background: var(--overlap-bg); }
      .day.is-makeup { background: var(--makeup-bg); }

      .day.is-today {
        border-color: var(--today-outline);
        box-shadow:
          0 0 0 1px rgba(210, 222, 248, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .day-flag-row {
        width: 100%;
        display: flex;
        justify-content: flex-end;
        gap: 6px;
      }

      .flag {
        min-width: 22px;
        height: 18px;
        padding: 0 6px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #f6f9ff;
        font-size: 0.66rem;
        font-weight: 800;
        border: 1px solid rgba(225, 234, 252, 0.16);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .flag.rest { background: linear-gradient(180deg, rgba(125, 194, 179, 0.9), rgba(75, 136, 126, 0.96)); }
      .flag.makeup { background: linear-gradient(180deg, rgba(152, 170, 228, 0.92), rgba(94, 113, 183, 0.96)); }
      .flag.holiday { background: linear-gradient(180deg, rgba(145, 159, 235, 0.92), rgba(97, 110, 193, 0.96)); }

      .day-number {
        font-size: 1.12rem;
        line-height: 1;
        font-weight: 800;
        color: rgba(247, 249, 255, 0.96);
        align-self: center;
      }

      .day.is-saturday .day-number { color: var(--saturday); }
      .day.is-sunday .day-number { color: var(--sunday); }

      .day-label {
        min-height: 1.1em;
        font-size: 0.72rem;
        color: rgba(240, 244, 252, 0.72);
      }

      body.glass-style .frame,
      body.glass-style .subpanel,
      body.glass-style .calendar-stage,
      body.glass-style .hero-controls,
      body.glass-style .stat-card,
      body.glass-style .hero-pill,
      body.glass-style .field input,
      body.glass-style .apply-button {
        background:
          linear-gradient(180deg, rgba(44, 54, 79, 0.5), rgba(18, 24, 36, 0.82)),
          rgba(255, 255, 255, 0.03);
      }

      body.light-theme {
        --body-bg:
          radial-gradient(circle at 10% 12%, rgba(109, 160, 255, 0.22), transparent 22%),
          radial-gradient(circle at 84% 12%, rgba(170, 198, 255, 0.28), transparent 20%),
          linear-gradient(180deg, #f4f8ff 0%, #e8f0ff 44%, #d9e6fb 100%);
        --surface:
          linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(241, 247, 255, 0.96));
        --surface-soft:
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(243, 247, 255, 0.98));
        --surface-subtle:
          linear-gradient(180deg, rgba(250, 252, 255, 0.96), rgba(239, 245, 255, 1));
        --surface-ribbon:
          linear-gradient(180deg, rgba(237, 239, 244, 0.98), rgba(204, 208, 217, 0.96) 50%, rgba(174, 178, 188, 0.98));
        --border: rgba(165, 187, 227, 0.42);
        --border-soft: rgba(255, 255, 255, 0.62);
        --text: #1f2736;
        --text-soft: rgba(37, 46, 62, 0.82);
        --text-mute: rgba(69, 83, 106, 0.56);
        --text-faint: rgba(69, 83, 106, 0.3);
        --shadow-panel:
          0 24px 54px rgba(123, 152, 214, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.78);
        --shadow-soft:
          0 14px 30px rgba(137, 164, 220, 0.12),

        --weekend-bg: linear-gradient(180deg, rgba(229, 236, 255, 0.98), rgba(210, 220, 250, 1));
        --holiday-bg: linear-gradient(180deg, rgba(223, 232, 255, 1), rgba(210, 220, 246, 1));
        --rest-bg: linear-gradient(180deg, rgba(216, 244, 240, 1), rgba(203, 236, 231, 1));
        --overlap-bg: linear-gradient(180deg, rgba(221, 229, 255, 1), rgba(208, 219, 252, 1));
        --makeup-bg: linear-gradient(180deg, rgba(224, 234, 255, 1), rgba(213, 223, 249, 1));
        --today-outline: rgba(119, 148, 224, 0.68);
      }

      .light-theme .window-dots span:nth-child(1) { box-shadow: 0 2px 6px rgba(255, 96, 87, 0.22); }
      .light-theme .window-dots span:nth-child(2) { box-shadow: 0 2px 6px rgba(255, 189, 46, 0.22); }
      .light-theme .window-dots span:nth-child(3) { box-shadow: 0 2px 6px rgba(40, 202, 66, 0.22); }

      @media (max-width: 1280px) {
        .hero {

  </head>
  <body class="dark-theme graphite-style">
    <div class="app-shell">

    <script>
      const THEME_STORAGE_KEY = "work-rest-calendar-theme-v4";
      const SURFACE_STORAGE_KEY = "work-rest-calendar-surface-v4";
      const SETTINGS_STORAGE_KEY = "work-rest-calendar-settings-v4";

      const weekdayNames = ["一", "二", "三", "四", "五", "六", "日"];
      const monthNames = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];

      const officialHolidayData = {
        2025: {
          holidays: [
            { name: "元旦", dates: expandDateRange("2025-01-01", "2025-01-01") },
            { name: "春节", dates: expandDateRange("2025-01-28", "2025-02-04") },
            { name: "清明节", dates: expandDateRange("2025-04-04", "2025-04-06") },
            { name: "劳动节", dates: expandDateRange("2025-05-01", "2025-05-05") },
            { name: "端午节", dates: expandDateRange("2025-05-31", "2025-06-02") },
            { name: "国庆节", dates: expandDateRange("2025-10-01", "2025-10-08") }
          ],
          workdays: ["2025-01-26", "2025-02-08", "2025-04-27", "2025-09-28", "2025-10-11"]
        },
        2026: {
          holidays: [
            { name: "元旦", dates: expandDateRange("2026-01-01", "2026-01-03") },
            { name: "春节", dates: expandDateRange("2026-02-15", "2026-02-23") },
            { name: "清明节", dates: expandDateRange("2026-04-04", "2026-04-06") },
            { name: "劳动节", dates: expandDateRange("2026-05-01", "2026-05-05") },
            { name: "端午节", dates: expandDateRange("2026-06-19", "2026-06-21") },
            { name: "中秋节", dates: expandDateRange("2026-09-25", "2026-09-27") },
            { name: "国庆节", dates: expandDateRange("2026-10-01", "2026-10-07") }
          ],
          workdays: ["2026-01-04", "2026-02-14", "2026-02-28", "2026-05-09", "2026-09-20", "2026-10-10"]
        }
      };

      const weatherCodeMap = {
        0: "晴",
        1: "大部晴朗",
        2: "局部多云",
        3: "阴",
        45: "有雾",
        48: "冻雾",
        51: "毛毛雨",
        53: "小雨",
        55: "细雨",
        61: "小雨",
        63: "中雨",
        65: "大雨",
        71: "小雪",
        73: "中雪",
        75: "大雪",
        80: "阵雨",
        81: "强阵雨",
        82: "暴雨",
        95: "雷阵雨"
      };

      const yearInput = document.getElementById("year-input");
      const cycleStartInput = document.getElementById("cycle-start");
      const workDaysInput = document.getElementById("work-days");
      const restDaysInput = document.getElementById("rest-days");
      const applyButton = document.getElementById("apply-button");
      const weatherLocationButton = document.getElementById("weather-location");
      const weatherBadge = document.getElementById("weather-badge");
      const weatherLocationText = document.getElementById("weather-location-text");
      const weatherTemperature = document.getElementById("weather-temperature");
      const weatherStatus = document.getElementById("weather-status");
      const themeToggle = document.getElementById("theme-toggle");
      const themeToggleText = document.getElementById("theme-toggle-text");
      const styleToggle = document.getElementById("style-toggle");
      const styleToggleText = document.getElementById("style-toggle-text");
      const styleToggleLabel = document.getElementById("style-toggle-label");
      const calendarTitle = document.getElementById("calendar-title");
      const monthChip = document.getElementById("month-chip");
      const holidayCount = document.getElementById("holiday-count");
      const restCount = document.getElementById("rest-count");
      const makeupCount = document.getElementById("makeup-count");
      const overlapCount = document.getElementById("overlap-count");
      const weekdayRow = document.getElementById("weekday-row");
      const daysGrid = document.getElementById("days-grid");
      const prevMonthButton = document.getElementById("prev-month-button");
      const nextMonthButton = document.getElementById("next-month-button");
      const todayMonthButton = document.getElementById("today-month-button");

      const defaultSettings = {
        year: 2026,
        viewMonth: 5,
        cycleStart: "2026-06-07",
        workDays: 3,
        restDays: 1
      };

      const viewState = {
        month: defaultSettings.viewMonth
      };

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function expandDateRange(startText, endText) {
        const result = [];
        const start = new Date(`${startText}T00:00:00`);
        const end = new Date(`${endText}T00:00:00`);
        const cursor = new Date(start);

        while (cursor <= end) {
          result.push(toDateKey(cursor));
          cursor.setDate(cursor.getDate() + 1);
        }

        return result;
      }

      function toDateKey(date) {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      }

      function saveSettings(settings) {
        localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settings));
      }

      function loadSettings() {
        try {
          const parsed = JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY) || "null");
          if (!parsed) {
            return { ...defaultSettings };
          }

          return {
            year: Number(parsed.year) || defaultSettings.year,
            viewMonth: Number.isInteger(parsed.viewMonth) ? parsed.viewMonth : defaultSettings.viewMonth,
            cycleStart: parsed.cycleStart || defaultSettings.cycleStart,
            workDays: Number(parsed.workDays) || defaultSettings.workDays,
            restDays: Number(parsed.restDays) || defaultSettings.restDays
          };
        } catch (error) {
          return { ...defaultSettings };
        }
      }

      function fillInputs(settings) {
        yearInput.value = settings.year;
        cycleStartInput.value = settings.cycleStart;
        workDaysInput.value = settings.workDays;
        restDaysInput.value = settings.restDays;
      }

      function getSettingsFromInputs() {
        return {
          year: Number(yearInput.value),
          viewMonth: viewState.month,
          cycleStart: cycleStartInput.value,
          workDays: Number(workDaysInput.value),
          restDays: Number(restDaysInput.value)
        };
      }

      function clampMonth(month) {
        return Math.min(11, Math.max(0, month));
      }

      function getDateDiffDays(startDate, endDate) {
        const start = Date.UTC(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
        const end = Date.UTC(endDate.getFullYear(), endDate.getMonth(), endDate.getDate());
        return Math.round((end - start) / 86400000);
      }

      function getCyclePosition(targetDate, cycleStartText, workDays, restDays) {
        const cycleStart = new Date(`${cycleStartText}T00:00:00`);
        if (Number.isNaN(cycleStart.getTime())) {
          return null;
        }

        const cycleLength = workDays + restDays;
        if (cycleLength <= 0) {
          return null;
        }

        const diff = getDateDiffDays(cycleStart, targetDate);
        return ((diff % cycleLength) + cycleLength) % cycleLength;
      }

      function isRestDay(targetDate, cycleStartText, workDays, restDays) {
        const position = getCyclePosition(targetDate, cycleStartText, workDays, restDays);
        return position !== null && position >= workDays;
      }

      function createOfficialHolidayMap(year) {
        const source = officialHolidayData[year];
        const map = new Map();
        if (!source) {
          return map;
        }

        source.holidays.forEach((holiday) => {
          holiday.dates.forEach((dateKey) => map.set(dateKey, holiday.name));
        });

        return map;
      }

      function createOfficialWorkdaySet(year) {
        const source = officialHolidayData[year];
        return new Set(source ? source.workdays : []);
      }

      function setWeatherBadge({ location, detail }) {
        weatherLocationText.textContent = location;
        const [temperature = "24°C", status = "阴"] = String(detail || "24°C / 阴")
          .split("/")
          .map((item) => item.trim());
        weatherTemperature.textContent = temperature;
        weatherStatus.textContent = status;
      }

      async function fetchLocationContext(latitude, longitude) {
        const url = new URL("https://api.bigdatacloud.net/data/reverse-geocode-client");
        url.searchParams.set("latitude", String(latitude));
        url.searchParams.set("longitude", String(longitude));
        url.searchParams.set("localityLanguage", "zh");

        const response = await fetch(url.toString());
        if (!response.ok) {
          throw new Error(`location ${response.status}`);
        }

        const payload = await response.json();
        const city = payload.city || payload.locality || "";
        const subdivision = payload.principalSubdivision || "";
        return [city, subdivision].filter(Boolean).join(" / ") || "当前位置";
      }

      async function fetchWeather(latitude, longitude, locationLabel) {
        const url = new URL("https://api.open-meteo.com/v1/forecast");
        url.searchParams.set("latitude", String(latitude));
        url.searchParams.set("longitude", String(longitude));
        url.searchParams.set("current", "temperature_2m,weather_code");
        url.searchParams.set("timezone", "auto");

        const response = await fetch(url.toString());
        if (!response.ok) {
          throw new Error(`weather ${response.status}`);
        }

        const payload = await response.json();
        const current = payload.current || {};
        const weatherText = weatherCodeMap[current.weather_code] || "晴";
        const temperature = `${Math.round(current.temperature_2m ?? 24)}°C`;
        setWeatherBadge({ location: locationLabel, detail: `${temperature} / ${weatherText}` });
      }

      function getCurrentPosition() {
        return new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: false,
            timeout: 5000,
            maximumAge: 15 * 60 * 1000
          });
        });
      }

      async function refreshWeatherBadge() {
        setWeatherBadge({ location: "定位中", detail: "24°C / 阴" });

        try {
          const position = await getCurrentPosition();
          let locationLabel = "当前位置";

          try {
            locationLabel = await fetchLocationContext(position.coords.latitude, position.coords.longitude);
          } catch (error) {
            // Ignore reverse geocode failures and keep fallback text.
          }

          await fetchWeather(position.coords.latitude, position.coords.longitude, locationLabel);
          return;
        } catch (error) {
          // Ignore and fall back to a stable default.
        }

        setWeatherBadge({ location: "驻马店市 / 河南省", detail: "24°C / 阴" });
      }

      function renderWeekdays() {
        weekdayRow.innerHTML = "";
        weekdayNames.forEach((name, index) => {
          const node = document.createElement("div");
          node.textContent = name;
          if (index >= 5) {
            node.classList.add("is-weekend");
          }
          weekdayRow.appendChild(node);
        });
      }

      function renderCalendar() {
        const settings = getSettingsFromInputs();
        const activeMonth = clampMonth(settings.viewMonth);
        const holidayMap = createOfficialHolidayMap(settings.year);
        const workdaySet = createOfficialWorkdaySet(settings.year);
        const todayKey = toDateKey(new Date());

        let holidayTotal = 0;
        let restTotal = 0;
        let makeupTotal = 0;
        let overlapTotal = 0;

        calendarTitle.textContent = `${settings.year}年${monthNames[activeMonth]}`;
        monthChip.textContent = `${settings.year}.${pad(activeMonth + 1)}`;
        daysGrid.innerHTML = "";

        const firstDay = new Date(settings.year, activeMonth, 1);
        const daysInMonth = new Date(settings.year, activeMonth + 1, 0).getDate();
        const startWeekday = (firstDay.getDay() + 6) % 7;
        const totalSlots = startWeekday + daysInMonth;
        const weekCount = Math.ceil(totalSlots / 7);
        daysGrid.style.setProperty("--week-count", String(weekCount));

        for (let index = 0; index < startWeekday; index += 1) {
          const empty = document.createElement("div");
          empty.className = "day empty";
          empty.setAttribute("aria-hidden", "true");
          daysGrid.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day += 1) {
          const currentDate = new Date(settings.year, activeMonth, day);
          const dateKey = toDateKey(currentDate);
          const holidayLabel = holidayMap.get(dateKey);
          const isOfficialWorkday = workdaySet.has(dateKey);
          const isWeekend = currentDate.getDay() === 0 || currentDate.getDay() === 6;
          const rest = !isOfficialWorkday && isRestDay(currentDate, settings.cycleStart, settings.workDays, settings.restDays);
          const isOverlap = rest && (isWeekend || Boolean(holidayLabel));
          const isToday = dateKey === todayKey;

          if (holidayLabel) holidayTotal += 1;
          if (rest) restTotal += 1;
          if (isOfficialWorkday) makeupTotal += 1;
          if (isOverlap) overlapTotal += 1;

          const node = document.createElement("article");
          node.className = "day";

          if (holidayLabel) node.classList.add("is-holiday");
          if (rest) node.classList.add("is-rest");
          if (isOfficialWorkday) node.classList.add("is-makeup");
          if (isOverlap) node.classList.add("is-overlap");
          if (isWeekend) node.classList.add("is-weekend");
          if (currentDate.getDay() === 6) node.classList.add("is-saturday");
          if (currentDate.getDay() === 0) node.classList.add("is-sunday");
          if (isToday) node.classList.add("is-today");

          const flag = holidayLabel
            ? `<span class="flag holiday">假</span>`
            : isOfficialWorkday
              ? `<span class="flag makeup">班</span>`
              : rest
                ? `<span class="flag rest">休</span>`
                : "";

          node.innerHTML = `
            <div class="day-flag-row">${flag}</div>
            <div class="day-number">${day}</div>
            <div class="day-label">${holidayLabel || ""}</div>
          `;

          daysGrid.appendChild(node);
        }

        const trailingSlots = weekCount * 7 - totalSlots;
        for (let index = 0; index < trailingSlots; index += 1) {
          const empty = document.createElement("div");
          empty.className = "day empty";
          empty.setAttribute("aria-hidden", "true");
          daysGrid.appendChild(empty);
        }

        holidayCount.textContent = String(holidayTotal);
        restCount.textContent = String(restTotal);
        makeupCount.textContent = String(makeupTotal);
        overlapCount.textContent = String(overlapTotal);

        saveSettings(settings);
      }

      function shiftMonth(step) {
        let year = Number(yearInput.value) || new Date().getFullYear();
        let month = viewState.month + step;

        if (month < 0) {
          month = 11;
          year -= 1;
        } else if (month > 11) {
          month = 0;
          year += 1;
        }

        yearInput.value = year;
        viewState.month = clampMonth(month);
        renderCalendar();
      }

      function applyTheme(theme) {
        const isDark = theme !== "light";
        document.body.classList.toggle("dark-theme", isDark);
        document.body.classList.toggle("light-theme", !isDark);
        themeToggle.setAttribute("aria-pressed", String(isDark));
        themeToggleText.textContent = isDark ? "深色模式" : "浅色模式";
        localStorage.setItem(THEME_STORAGE_KEY, isDark ? "dark" : "light");
      }

      function loadTheme() {
        return localStorage.getItem(THEME_STORAGE_KEY) === "light" ? "light" : "dark";
      }

      function applySurfaceStyle(style) {
        const isGlass = style === "glass";
        document.body.classList.toggle("glass-style", isGlass);
        document.body.classList.toggle("graphite-style", !isGlass);
        styleToggle.setAttribute("aria-pressed", String(isGlass));
        styleToggleText.textContent = isGlass ? "Liquid Glass" : "Graphite";
        styleToggleLabel.textContent = isGlass ? "Surface" : "Graphite";
        localStorage.setItem(SURFACE_STORAGE_KEY, isGlass ? "glass" : "graphite");
      }

      function loadSurfaceStyle() {
        return localStorage.getItem(SURFACE_STORAGE_KEY) === "glass" ? "glass" : "graphite";
      }

      function initializePage() {
        const settings = loadSettings();
        viewState.month = clampMonth(settings.viewMonth);
        fillInputs(settings);
        renderWeekdays();
        applyTheme(loadTheme());
        applySurfaceStyle(loadSurfaceStyle());
        renderCalendar();
        refreshWeatherBadge();
      }

      applyButton.addEventListener("click", renderCalendar);
      prevMonthButton.addEventListener("click", () => shiftMonth(-1));
      nextMonthButton.addEventListener("click", () => shiftMonth(1));
      todayMonthButton.addEventListener("click", () => {
        const now = new Date();
        yearInput.value = now.getFullYear();
        viewState.month = now.getMonth();
        renderCalendar();
      });
      themeToggle.addEventListener("click", () => {
        applyTheme(document.body.classList.contains("dark-theme") ? "light" : "dark");
      });
      styleToggle.addEventListener("click", () => {
        applySurfaceStyle(document.body.classList.contains("glass-style") ? "graphite" : "glass");
      });
      weatherBadge.addEventListener("click", refreshWeatherBadge);
      weatherLocationButton.addEventListener("click", refreshWeatherBadge);

      initializePage();
    </script>
  </body>
</html>
