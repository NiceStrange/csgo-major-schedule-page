<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>节假日与休息日日历</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");
      :root {
        --bg: #f2f2f7;
        --bg-strong: #e9e9ef;
        --paper: rgba(255, 255, 255, 0.78);
        --paper-strong: rgba(255, 255, 255, 0.92);
        --paper-solid: #ffffff;
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --line: rgba(60, 60, 67, 0.12);
        --line-strong: rgba(60, 60, 67, 0.18);
        --accent: #0a84ff;
        --accent-deep: #0066cc;
        --accent-soft: rgba(10, 132, 255, 0.12);
        --weekend: rgba(90, 119, 255, 0.14);
        --weekend-ink: #4f63d8;
        --holiday: rgba(255, 159, 10, 0.16);
        --holiday-ink: #b05a00;
        --rest: rgba(68, 203, 143, 0.16);
        --rest-ink: #1e7e5f;
        --mix: rgba(183, 94, 255, 0.2);
        --mix-ink: #7d3fd6;
        --makeup: rgba(255, 99, 88, 0.16);
        --makeup-ink: #c34235;
        --today: #0a84ff;
        --shadow: 0 28px 72px rgba(29, 29, 31, 0.12);
        --shadow-soft: 0 12px 30px rgba(29, 29, 31, 0.07);
        --hero-sheen: linear-gradient(120deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.16) 42%, rgba(255, 255, 255, 0.52) 100%);
        --ease-fluid: cubic-bezier(0.32, 0.72, 0, 1);
        --ease-lift: cubic-bezier(0.22, 1, 0.36, 1);
      }

      body.dark-theme {
        --bg: #08090c;
        --bg-strong: #020305;
        --paper: rgba(10, 12, 16, 0.86);
        --paper-strong: rgba(16, 18, 23, 0.96);
        --paper-solid: #101217;
        --ink: #e8ecf1;
        --muted: #8c94a3;
        --line: rgba(255, 255, 255, 0.055);
        --line-strong: rgba(255, 255, 255, 0.085);
        --accent: #aab8da;
        --accent-deep: #edf1f8;
        --accent-soft: rgba(122, 135, 171, 0.09);
        --weekend: rgba(86, 96, 130, 0.14);
        --weekend-ink: #aab3d3;
        --holiday: rgba(82, 104, 132, 0.16);
        --holiday-ink: #ccd7e8;
        --rest: rgba(53, 101, 83, 0.16);
        --rest-ink: #bfd8ca;
        --mix: rgba(102, 71, 132, 0.18);
        --mix-ink: #d4c2e8;
        --makeup: rgba(120, 66, 61, 0.16);
        --makeup-ink: #debbb7;
        --today: #bcc8e6;
        --shadow: 0 26px 68px rgba(0, 0, 0, 0.42);
        --shadow-soft: 0 12px 24px rgba(0, 0, 0, 0.22);
        --hero-sheen: linear-gradient(180deg, rgba(255, 255, 255, 0.032), transparent 34%);
      }

      body.glass-style {
        --paper: rgba(255, 255, 255, 0.36);
        --paper-strong: rgba(255, 255, 255, 0.52);
        --paper-solid: rgba(255, 255, 255, 0.56);
        --line: rgba(255, 255, 255, 0.34);
        --line-strong: rgba(255, 255, 255, 0.48);
        --accent: #3674ef;
        --accent-deep: #1a56d9;
        --accent-soft: rgba(54, 116, 239, 0.12);
        --weekend: rgba(114, 145, 255, 0.18);
        --weekend-ink: #415fd3;
        --holiday: rgba(111, 190, 255, 0.16);
        --holiday-ink: #2e67c8;
        --rest: rgba(88, 198, 176, 0.16);
        --rest-ink: #156e68;
        --mix: rgba(144, 137, 255, 0.18);
        --mix-ink: #5a54ca;
        --makeup: rgba(181, 166, 230, 0.16);
        --makeup-ink: #7258b7;
        --today: #2a68ea;
        --hero-sheen: linear-gradient(120deg, rgba(255, 255, 255, 0.76), rgba(255, 255, 255, 0.12) 42%, rgba(171, 213, 255, 0.34) 100%);
      }

      body.dark-theme.glass-style {
        --paper: rgba(8, 13, 22, 0.42);
        --paper-strong: rgba(12, 18, 30, 0.58);
        --paper-solid: rgba(16, 22, 34, 0.68);
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.12);
        --accent: #b9c9f8;
        --accent-deep: #edf2ff;
        --accent-soft: rgba(136, 158, 214, 0.08);
        --weekend: rgba(86, 107, 167, 0.16);
        --weekend-ink: #c4d0f5;
        --holiday: rgba(74, 101, 162, 0.18);
        --holiday-ink: #d3defc;
        --rest: rgba(40, 98, 93, 0.18);
        --rest-ink: #c0e5db;
        --mix: rgba(80, 85, 168, 0.18);
        --mix-ink: #d7d5fb;
        --makeup: rgba(86, 82, 136, 0.18);
        --makeup-ink: #ddd4f4;
        --today: #f0f4ff;
        --hero-sheen: linear-gradient(180deg, rgba(255, 255, 255, 0.045), transparent 30%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "Plus Jakarta Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 0%, rgba(137, 178, 255, 0.18), transparent 28%),
          radial-gradient(circle at 100% 8%, rgba(202, 210, 224, 0.18), transparent 26%),
          radial-gradient(circle at 52% 100%, rgba(255, 255, 255, 0.7), transparent 36%),
          linear-gradient(180deg, #fbfbfd 0%, var(--bg) 38%, var(--bg-strong) 100%);
        overflow-x: hidden;
        transition: background 480ms var(--ease-fluid), color 260ms var(--ease-fluid);
      }

      body.theme-transitioning::before,
      body.theme-transitioning::after,
      body.theme-transitioning .glass-scene,
      body.theme-transitioning .glass-scene::before,
      body.theme-transitioning .glass-scene::after,
      body.theme-transitioning .grain,
      body.theme-transitioning .shell-rim,
      body.theme-transitioning .hero,
      body.theme-transitioning .hero::after,
      body.theme-transitioning .hero-badge,
      body.theme-transitioning .theme-toggle,
      body.theme-transitioning .style-toggle,
      body.theme-transitioning .theme-toggle-track,
      body.theme-transitioning .theme-toggle-thumb,
      body.theme-transitioning .style-toggle-orb,
      body.theme-transitioning .hero-kicker,
      body.theme-transitioning .hero-pill,
      body.theme-transitioning .hero-preview-card,
      body.theme-transitioning .panel,
      body.theme-transitioning .calendar-board,
      body.theme-transitioning .section,
      body.theme-transitioning .month-switcher,
      body.theme-transitioning .toolbar p,
      body.theme-transitioning .stat,
      body.theme-transitioning .month,
      body.theme-transitioning .day,
      body.theme-transitioning .field input,
      body.theme-transitioning .field textarea,
      body.theme-transitioning .button-row button,
      body.theme-transitioning .button-orb,
      body.theme-transitioning .flag {
        transition:
          background 620ms var(--ease-fluid),
          border-color 420ms var(--ease-fluid),
          box-shadow 620ms var(--ease-fluid),
          color 320ms var(--ease-fluid),
          opacity 420ms var(--ease-fluid),
          outline-color 420ms var(--ease-fluid),
          transform 420ms var(--ease-fluid);
      }

      body.dark-theme {
        color-scheme: dark;
        background:
          radial-gradient(circle at 12% 0%, rgba(72, 82, 122, 0.12), transparent 28%),
          radial-gradient(circle at 100% 8%, rgba(44, 84, 73, 0.08), transparent 24%),
          radial-gradient(circle at 50% 100%, rgba(84, 64, 110, 0.06), transparent 30%),
          linear-gradient(180deg, #0c0d11 0%, #08090c 42%, var(--bg-strong) 100%);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: auto;
        width: 340px;
        height: 340px;
        border-radius: 999px;
        filter: blur(60px);
        pointer-events: none;
        opacity: 0.55;
        z-index: 0;
      }

      body::before {
        top: -80px;
        right: -90px;
        background: rgba(0, 113, 227, 0.18);
        animation: floatBlobOne 18s var(--ease-fluid) infinite;
      }

      body::after {
        bottom: -120px;
        left: -80px;
        background: rgba(175, 82, 222, 0.14);
        animation: floatBlobTwo 24s var(--ease-fluid) infinite;
      }

      body.dark-theme::before {
        background: rgba(78, 87, 130, 0.1);
        opacity: 0.045;
      }

      body.dark-theme::after {
        background: rgba(70, 112, 96, 0.08);
        opacity: 0.04;
      }

      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: 0.038;
        background-image:
          radial-gradient(rgba(20, 24, 32, 0.18) 0.6px, transparent 0.6px),
          radial-gradient(rgba(255, 255, 255, 0.3) 0.6px, transparent 0.6px);
        background-position: 0 0, 12px 12px;
        background-size: 24px 24px;
        mix-blend-mode: soft-light;
      }

      body.dark-theme .grain {
        opacity: 0.02;
        mix-blend-mode: soft-light;
      }

      .glass-scene {
        position: fixed;
        inset: -12%;
        z-index: 0;
        pointer-events: none;
        opacity: 0;
        transform: scale(1.04);
        background:
          radial-gradient(circle at 14% 22%, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.42) 10%, transparent 24%),
          radial-gradient(circle at 82% 16%, rgba(98, 178, 255, 0.5), transparent 28%),
          radial-gradient(circle at 76% 72%, rgba(88, 214, 238, 0.32), transparent 22%),
          radial-gradient(circle at 26% 80%, rgba(168, 142, 255, 0.24), transparent 22%),
          linear-gradient(135deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0) 30%, rgba(129, 180, 255, 0.18) 60%, rgba(255, 255, 255, 0.42) 100%);
        filter: saturate(112%);
        transition:
          opacity 720ms var(--ease-fluid),
          transform 720ms var(--ease-fluid),
          filter 720ms var(--ease-fluid);
      }

      .glass-scene::before,
      .glass-scene::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
      }

      .glass-scene::before {
        background:
          radial-gradient(circle at 34% 18%, rgba(255, 255, 255, 0.62), transparent 16%),
          linear-gradient(118deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0) 28%, rgba(96, 160, 255, 0.16) 58%, rgba(255, 255, 255, 0.18) 86%);
        filter: blur(34px);
        opacity: 0.78;
      }

      .glass-scene::after {
        inset: 6% 4% 10%;
        border-radius: 48px;
        background:
          radial-gradient(circle at 20% 28%, rgba(255, 255, 255, 0.28), transparent 20%),
          radial-gradient(circle at 84% 30%, rgba(120, 196, 255, 0.26), transparent 18%),
          linear-gradient(152deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0) 42%, rgba(149, 199, 255, 0.14) 70%, rgba(255, 255, 255, 0.08) 100%);
        filter: blur(72px);
        opacity: 0.72;
      }

      body.dark-theme .glass-scene {
        background:
          radial-gradient(circle at 18% 24%, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.05) 10%, transparent 22%),
          radial-gradient(circle at 82% 18%, rgba(95, 132, 226, 0.36), transparent 28%),
          radial-gradient(circle at 74% 74%, rgba(72, 140, 218, 0.22), transparent 22%),
          radial-gradient(circle at 28% 80%, rgba(86, 92, 184, 0.18), transparent 20%),
          linear-gradient(142deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0) 34%, rgba(86, 126, 220, 0.14) 64%, rgba(255, 255, 255, 0.04) 100%);
        filter: saturate(104%);
      }

      body.dark-theme .glass-scene::before {
        background:
          radial-gradient(circle at 32% 18%, rgba(255, 255, 255, 0.14), transparent 14%),
          linear-gradient(118deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0) 30%, rgba(100, 132, 208, 0.12) 60%, rgba(255, 255, 255, 0.04) 88%);
        opacity: 0.58;
      }

      body.dark-theme .glass-scene::after {
        background:
          radial-gradient(circle at 20% 26%, rgba(255, 255, 255, 0.08), transparent 18%),
          radial-gradient(circle at 84% 30%, rgba(84, 132, 220, 0.18), transparent 18%),
          linear-gradient(152deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0) 44%, rgba(92, 124, 204, 0.12) 72%, rgba(255, 255, 255, 0.02) 100%);
        opacity: 0.56;
      }

      body.glass-style .glass-scene {
        opacity: 1;
        transform: scale(1);
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(1420px, calc(100% - 28px));
        margin: 14px auto 20px;
      }

      .shell-rim {
        position: relative;
        padding: 2px;
        border-radius: 38px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(219, 223, 230, 0.68)),
          rgba(255, 255, 255, 0.42);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.88),
          0 26px 54px rgba(27, 31, 38, 0.08);
      }

      .shell-rim > * {
        border-radius: inherit;
      }

      body.dark-theme .shell-rim {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.042), rgba(255, 255, 255, 0.008)),
          linear-gradient(180deg, rgba(15, 17, 22, 0.98), rgba(8, 9, 12, 0.98));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.03),
          inset 0 -1px 0 rgba(255, 255, 255, 0.02),
          0 10px 24px rgba(0, 0, 0, 0.24);
      }

      .hero {
        position: relative;
        padding: 18px 20px 20px;
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: 30px;
        background:
          radial-gradient(circle at 85% 20%, rgba(255, 255, 255, 0.68), transparent 24%),
          linear-gradient(145deg, rgba(255, 255, 255, 0.94), rgba(252, 253, 255, 0.78) 52%, rgba(244, 246, 251, 0.72)),
          var(--paper);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.86),
          0 18px 38px rgba(38, 44, 53, 0.08);
        overflow: hidden;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--hero-sheen);
        opacity: 0.42;
        pointer-events: none;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.9), transparent 62%);
      }

      .hero-top {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .hero-actions {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }

      .traffic-lights {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .traffic-lights span {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      .traffic-lights span:nth-child(1) {
        background: #ff5f57;
      }

      .traffic-lights span:nth-child(2) {
        background: #febc2e;
      }

      .traffic-lights span:nth-child(3) {
        background: #28c840;
      }

      .hero-badge {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.68);
        border: 1px solid rgba(60, 60, 67, 0.08);
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        user-select: none;
        transition: transform 380ms var(--ease-fluid), color 260ms var(--ease-fluid), border-color 260ms var(--ease-fluid), background 260ms var(--ease-fluid), box-shadow 380ms var(--ease-fluid);
      }

      .hero-badge::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(180deg, #34c759, #1ea94b);
        box-shadow: 0 0 0 4px rgba(52, 199, 89, 0.12);
        animation: pulseDot 2.6s var(--ease-fluid) infinite;
      }

      .hero-badge:hover {
        transform: translate3d(0, -1px, 0) scale(1.002);
        color: var(--accent);
        border-color: rgba(10, 132, 255, 0.18);
        background: rgba(255, 255, 255, 0.78);
      }

      .theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 7px 12px 7px 8px;
        border-radius: 999px;
        border: 1px solid rgba(60, 60, 67, 0.08);
        background: rgba(255, 255, 255, 0.64);
        color: var(--muted);
        font: inherit;
        font-size: 0.79rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
        transition:
          transform 380ms var(--ease-fluid),
          box-shadow 380ms var(--ease-fluid),
          color 260ms var(--ease-fluid),
          border-color 260ms var(--ease-fluid),
          background 260ms var(--ease-fluid);
      }

      .theme-toggle:hover {
        transform: translateY(-1px);
        color: var(--ink);
        border-color: rgba(10, 132, 255, 0.16);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.78),
          0 10px 20px rgba(29, 29, 31, 0.08);
      }

      .theme-toggle:focus-visible {
        outline: none;
        box-shadow:
          0 0 0 4px rgba(10, 132, 255, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.78);
      }

      .theme-toggle-track {
        position: relative;
        width: 34px;
        height: 20px;
        border-radius: 999px;
        background: rgba(120, 120, 128, 0.28);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);
        transition: background 260ms var(--ease-fluid);
      }

      .theme-toggle-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffffff, #f2f2f7);
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.82);
        transition: transform 300ms var(--ease-fluid), background 300ms var(--ease-fluid);
      }

      body.dark-theme .theme-toggle-thumb {
        transform: translateX(14px);
        background: linear-gradient(180deg, #f5f5f7, #d7d7de);
      }

      .style-toggle {
        position: relative;
        isolation: isolate;
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        min-width: 176px;
        padding: 7px 8px 7px 14px;
        border-radius: 999px;
        border: 1px solid rgba(60, 60, 67, 0.08);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.74), rgba(248, 250, 255, 0.6));
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.76),
          0 8px 18px rgba(29, 29, 31, 0.06);
        transition:
          transform 420ms var(--ease-fluid),
          box-shadow 420ms var(--ease-fluid),
          color 260ms var(--ease-fluid),
          border-color 260ms var(--ease-fluid),
          background 260ms var(--ease-fluid);
      }

      .style-toggle::before {
        content: "";
        position: absolute;
        inset: 1px;
        z-index: 0;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0));
        opacity: 0.8;
        pointer-events: none;
      }

      .style-toggle-copy,
      .style-toggle-orb {
        position: relative;
        z-index: 1;
      }

      .style-toggle-copy {
        display: grid;
        gap: 2px;
        text-align: left;
      }

      .style-toggle-label {
        color: color-mix(in srgb, var(--muted) 84%, transparent);
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .style-toggle-text {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .style-toggle-orb {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.68);
        background:
          radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.18) 36%, transparent 60%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(233, 240, 255, 0.56));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.88),
          0 6px 14px rgba(54, 77, 118, 0.12);
        transition:
          transform 420ms var(--ease-fluid),
          box-shadow 420ms var(--ease-fluid),
          border-color 260ms var(--ease-fluid),
          background 260ms var(--ease-fluid);
      }

      .style-toggle-orb::before,
      .style-toggle-orb::after {
        content: "";
        position: absolute;
        border-radius: 999px;
      }

      .style-toggle-orb::before {
        inset: 8px;
        background: linear-gradient(180deg, rgba(66, 136, 255, 0.5), rgba(142, 197, 255, 0.16));
      }

      .style-toggle-orb::after {
        inset: 4px 6px auto;
        height: 7px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0));
        opacity: 0.8;
      }

      .style-toggle:hover {
        transform: translateY(-1px);
        border-color: rgba(74, 118, 204, 0.18);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.82),
          0 12px 22px rgba(38, 50, 76, 0.08);
      }

      .style-toggle:hover .style-toggle-orb {
        transform: translate3d(0, -1px, 0) scale(1.03);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 8px 18px rgba(64, 95, 153, 0.12);
      }

      .style-toggle[aria-pressed="true"] {
        border-color: rgba(101, 151, 255, 0.24);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(238, 246, 255, 0.68)),
          rgba(255, 255, 255, 0.72);
        box-shadow:

      .hero-preview-dot {

      .hero p {
        margin: 16px 0 0;
        max-width: 760px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.75;

      .layout {
        display: grid;
        grid-template-columns: 286px minmax(0, 1fr);
        gap: 16px;
        margin-top: 12px;
        align-items: start;
      }

      .panel,
      .calendar-board {
        border: 1px solid rgba(255, 255, 255, 0.74);
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(248, 250, 254, 0.74)),

        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.88),
          0 10px 22px rgba(31, 34, 40, 0.05);

          border-color 260ms var(--ease-fluid),
          box-shadow 420ms var(--ease-fluid),
          background 260ms var(--ease-fluid);

      .panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        align-self: start;
        position: sticky;
        top: 10px;
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
      }

      .section {
        position: relative;
        padding: 14px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(247, 249, 252, 0.72));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.82),
          0 10px 22px rgba(29, 32, 37, 0.045);
        transition:
          box-shadow 420ms var(--ease-fluid),
          border-color 260ms var(--ease-fluid),
          background 260ms var(--ease-fluid);
      }

      .section::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.28), transparent 46%);
        pointer-events: none;
      }

      .section:hover {
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.84),

        border-color: rgba(255, 255, 255, 0.88);

      .section + .section {

      .section-head {
        display: grid;
        gap: 4px;
        margin-bottom: 10px;
      }

      .section-cap {
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .section h2 {

        font-size: 0.98rem;
        font-weight: 600;
        letter-spacing: -0.03em;

      .field-grid {

      .field label {
        display: block;
        margin-bottom: 5px;
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--muted);
      }

      .field input,
      .field textarea,
      .field button {
        width: 100%;
        border-radius: 18px;
        border: 1px solid rgba(15, 23, 42, 0.06);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(247, 249, 253, 0.96));
        color: var(--ink);
        font: inherit;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.82),
          0 8px 18px rgba(25, 28, 34, 0.04);
      }

      .field input,
      .field textarea {
        padding: 11px 14px;
        transition: border-color 260ms var(--ease-fluid), box-shadow 380ms var(--ease-fluid), transform 380ms var(--ease-fluid);
      }

      .field input:focus,
      .field textarea:focus {
        outline: none;
        border-color: rgba(0, 113, 227, 0.35);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.7),
          0 0 0 4px rgba(10, 132, 255, 0.12);
      }

      .field textarea {
        min-height: 184px;
        resize: vertical;
        line-height: 1.6;
      }

      .button-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .button-row button {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        flex: 1 1 140px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 50px;
        padding: 10px 12px 10px 16px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 999px;
        font-weight: 700;
        letter-spacing: -0.01em;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(244, 247, 252, 0.94)),
          rgba(255, 255, 255, 0.9);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.92),
          0 14px 28px rgba(24, 28, 34, 0.06);
        transition:
          transform 420ms var(--ease-fluid),
          box-shadow 420ms var(--ease-fluid),
          filter 260ms var(--ease-fluid),
          background 260ms var(--ease-fluid),
          border-color 260ms var(--ease-fluid),
          color 260ms var(--ease-fluid);
      }

      .button-row button::before {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.58), rgba(255, 255, 255, 0));
        opacity: 0.82;
        pointer-events: none;
      }

      .primary {
        color: var(--ink);
        border-color: rgba(86, 102, 130, 0.14);
      }

      .button-copy {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: inherit;
        font-size: 0.88rem;
      }

      .button-orb {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 999px;
        border: 1px solid rgba(15, 23, 42, 0.06);
        background: linear-gradient(180deg, rgba(32, 37, 45, 0.08), rgba(32, 37, 45, 0.03));
        color: var(--accent-deep);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.78),
          0 4px 14px rgba(22, 28, 36, 0.08);
        transition: transform 420ms var(--ease-fluid), background 260ms var(--ease-fluid), box-shadow 420ms var(--ease-fluid);
      }

      .button-orb svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        stroke-width: 1.75;
        fill: none;
      }

      .ghost {
        background: rgba(255, 255, 255, 0.82);
      }

      .button-row button:hover {
        transform: translateY(-2px) scale(1.004);
        border-color: rgba(118, 132, 163, 0.18);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.96),
          0 20px 34px rgba(24, 28, 34, 0.08);
        filter: saturate(1.03);

      .button-row button:active {

          inset 0 1px 0 rgba(255, 255, 255, 0.82),

      .legend-item {

        padding: 14px 14px 15px;

      .toolbar {

        border-bottom: 1px solid rgba(15, 23, 42, 0.06);

        justify-content: space-between;
        gap: 10px;
        width: 100%;

      .toolbar-copy {

        display: grid;
        gap: 4px;
      }

      .month-switcher {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px;
        border-radius: 999px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        background: rgba(255, 255, 255, 0.8);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.8),
          0 8px 18px rgba(18, 21, 28, 0.05);

          transform 420ms var(--ease-fluid),
          border-color 260ms var(--ease-fluid),
          box-shadow 420ms var(--ease-fluid),

      .month-switcher button {

      .nav-icon {

      .toolbar h2 {

      .stats {

      .stat {

        border-radius: 18px;
        border: 1px solid rgba(15, 23, 42, 0.08);

          inset 0 1px 0 rgba(255, 255, 255, 0.82),

        transition:
          transform 420ms var(--ease-fluid),

          background 260ms var(--ease-fluid);

      .stat-primary {

      .stat::after {
        content: "";

        background: linear-gradient(135deg, rgba(10, 132, 255, 0.08), transparent 60%);
        opacity: 0.8;
        pointer-events: none;

      .stat:hover {
        transform: translate3d(0, -1px, 0) scale(1.002);
        border-color: rgba(103, 128, 174, 0.16);

          inset 0 1px 0 rgba(255, 255, 255, 0.88),

      .stat strong {

      .stat span {

      .months {

      .month {

        border-radius: 24px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(247, 249, 253, 0.88));
        overflow: hidden;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.82),
          0 10px 22px rgba(24, 28, 34, 0.05);
        transition:
          border-color 260ms var(--ease-fluid),
          box-shadow 420ms var(--ease-fluid),
          background 260ms var(--ease-fluid);

      .month:hover {

      .month-head {

        align-items: baseline;
        justify-content: center;
        padding: 11px 14px 10px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.06);
        background: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.34));

          0 6px 16px rgba(18, 24, 33, 0.035);

      .day-label {

      async function ensureLatestBuild() {
        try {
          const response = await fetch(`./version.json?ts=${Date.now()}`, {
            cache: "no-store"
          });

          if (!response.ok) {
            return false;
          }

          const payload = await response.json();
          const latestVersion = payload.version;
          if (!latestVersion || latestVersion === APP_VERSION) {
            return false;
          }

          const nextUrl = new URL(window.location.href);
          if (nextUrl.searchParams.get("v") !== latestVersion) {
            nextUrl.searchParams.set("v", latestVersion);
            window.location.replace(nextUrl.toString());
            return true;
          }
        } catch (error) {
          // Ignore update-check failures so the calendar still loads offline or on flaky networks.
        }

        return false;
      }

      async function fetchWeather(latitude, longitude, city) {
        const url = new URL("https://api.open-meteo.com/v1/forecast");
        url.searchParams.set("latitude", String(latitude));
        url.searchParams.set("longitude", String(longitude));
        url.searchParams.set("current", "temperature_2m,weather_code");
        url.searchParams.set("timezone", "auto");

        const response = await fetch(url.toString());
        if (!response.ok) {
          throw new Error(`weather ${response.status}`);
        }

        const payload = await response.json();
        if (!payload.current) {
          throw new Error("missing current weather");
        }

        setWeatherBadge(formatWeatherDisplay(city, payload.current));

      function getCurrentPosition() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error("geolocation unavailable"));
            return;
          }

          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: false,
            timeout: 5000,
            maximumAge: 15 * 60 * 1000
          });
        });
      }

      async function updateWeatherBadge() {
        setWeatherBadge("天气读取中");

        try {
          const position = await getCurrentPosition();
          await fetchWeather(position.coords.latitude, position.coords.longitude, "当前位置");
          return;
        } catch (error) {
          // Ignore and fall back to Shanghai so the badge always shows a weather status.
        }

        try {
          await fetchWeather(31.2304, 121.4737, "上海");
        } catch (error) {
          setWeatherBadge("天气暂不可用");
        }
      }

      async function refreshWeatherBadge() {
        setWeatherBadge("Loading weather");

        try {
          const position = await getCurrentPosition();
          let locationLabel = "Current location";

          try {
            locationLabel = await fetchLocationContext(position.coords.latitude, position.coords.longitude);
          } catch (error) {
            // Keep live weather visible even if reverse geocoding fails.
          }

          await fetchWeather(position.coords.latitude, position.coords.longitude, locationLabel);
          return;
        } catch (error) {
          // Ignore and fall back to a default city so the badge always shows a usable status.

        try {

          setWeatherBadge("Weather unavailable");

          return;

          permissionStatus.onchange = () => {

      function toDateKey(date) {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      }

      function expandDateRange(startText, endText) {
        const dates = [];
        const cursor = new Date(`${startText}T00:00:00`);
        const end = new Date(`${endText}T00:00:00`);

        while (cursor <= end) {
          dates.push(toDateKey(cursor));
          cursor.setDate(cursor.getDate() + 1);
        }

        return dates;
      }

      function getOfficialSchedule(year) {
        return OFFICIAL_SCHEDULES[year] || null;

      function createOfficialHolidayMap(year) {
        const schedule = getOfficialSchedule(year);
        const map = new Map();

        if (!schedule) {
          return map;
        }

        schedule.holidays.forEach((holiday) => {
          holiday.dates.forEach((date) => {
            map.set(date, holiday.name);
          });
        });

        return map;
      }

        const schedule = getOfficialSchedule(year);

            cycleStart: parsed.cycleStart || defaults.cycleStart,
            workDays: Number(parsed.workDays) || defaults.workDays,
            restDays: Number(parsed.restDays) || defaults.restDays

      function getDateDiffDays(baseDate, targetDate) {
        const millisecondsPerDay = 24 * 60 * 60 * 1000;
        const base = Date.UTC(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
        const target = Date.UTC(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
        return Math.floor((target - base) / millisecondsPerDay);
      }

      function getCyclePosition(targetDate, cycleStartText, workDays, restDays) {
        const cycleStart = new Date(`${cycleStartText}T00:00:00`);
        if (Number.isNaN(cycleStart.getTime())) {
          return null;
        }

        const cycleLength = workDays + restDays;
        if (cycleLength <= 0) {
          return null;
        }

        const diff = getDateDiffDays(cycleStart, targetDate);
        return ((diff % cycleLength) + cycleLength) % cycleLength;
      }

      function isRestDay(targetDate, cycleStartText, workDays, restDays) {
        const position = getCyclePosition(targetDate, cycleStartText, workDays, restDays);
        return position !== null && position >= workDays;
      }

      function clampMonth(month) {

      function setupRevealObserver() {
        const revealNodes = document.querySelectorAll(".reveal");

        if (!("IntersectionObserver" in window)) {
          revealNodes.forEach((node) => node.classList.add("is-visible"));
          return;
        }

        if (revealObserver) {
          revealObserver.disconnect();
        }

        revealObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) {
                return;
              }

              entry.target.classList.add("is-visible");
              revealObserver.unobserve(entry.target);
            });
          },
          {
            threshold: 0.14,
            rootMargin: "0px 0px -8% 0px"
          }
        );

        revealNodes.forEach((node, index) => {
          node.style.setProperty("--reveal-delay", `${Math.min(index * 48, 240)}ms`);
          revealObserver.observe(node);
        });
      }

      function shiftMonth(step) {
        let year = Number(yearInput.value) || new Date().getFullYear();
        let month = viewState.month + step;

        if (month < 0) {
          month = 11;
          year -= 1;
        } else if (month > 11) {
          month = 0;
          year += 1;
        }

        yearInput.value = year;
        setViewMonth(month);
        renderCalendar();

      function bindHoverBounce(root = document) {
        if (!window.matchMedia || !window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
          return;
        }

        root.querySelectorAll(".hero-badge, .month-switcher, .theme-toggle, .style-toggle, .stat, .day:not(.empty)").forEach((node) => {
          if (node.dataset.hoverBound === "true") {
            return;
          }

          node.dataset.hoverBound = "true";
          node.addEventListener("mouseenter", () => {
            node.classList.remove("hover-bounce");
            void node.offsetWidth;
            node.classList.add("hover-bounce");
          });

          node.addEventListener("mouseleave", () => {
            node.classList.remove("hover-bounce");
          });
        });
      }

      function renderCalendar() {
        const settings = getSettingsFromInputs();
        const holidayMap = createOfficialHolidayMap(settings.year);
        const workdaySet = createOfficialWorkdaySet(settings.year);
        const todayKey = toDateKey(new Date());
        const activeMonth = clampMonth(settings.viewMonth);

        let holidayTotal = 0;
        let restTotal = 0;
        let makeupTotal = 0;
        let overlapTotal = 0;

        calendarTitle.textContent = `${settings.year} 年 ${monthNames[activeMonth]}`;
        calendarSubtitle.textContent = "";

        monthChip.textContent = `${settings.year}.${pad(activeMonth + 1)}`;
        heroMonth.textContent = `${settings.year} 年 ${monthNames[activeMonth]}`;
        heroCycle.textContent = "";
        monthsNode.innerHTML = "";

        const firstDay = new Date(settings.year, activeMonth, 1);
        const daysInMonth = new Date(settings.year, activeMonth + 1, 0).getDate();
        const startWeekday = (firstDay.getDay() + 6) % 7;

        const monthNode = document.createElement("section");
        monthNode.className = "month reveal";

        const monthHead = document.createElement("div");
        monthHead.className = "month-head";
        monthHead.innerHTML = `<h3>${monthNames[activeMonth]}</h3><span>${settings.year}.${pad(activeMonth + 1)}</span>`;
        monthNode.appendChild(monthHead);

        const weekdayRow = document.createElement("div");
        weekdayRow.className = "weekdays";
        weekdayNames.forEach((weekday, weekdayIndex) => {
          const node = document.createElement("div");
          node.textContent = weekday;
          if (weekdayIndex === 5 || weekdayIndex === 6) {
            node.classList.add("is-weekend");
          }
          weekdayRow.appendChild(node);
        });
        monthNode.appendChild(weekdayRow);

        const daysGrid = document.createElement("div");
        daysGrid.className = "days";

        for (let day = 1; day <= daysInMonth; day += 1) {
          const currentDate = new Date(settings.year, activeMonth, day);
          const dateKey = toDateKey(currentDate);
          const holidayLabel = holidayMap.get(dateKey);
          const isOfficialWorkday = workdaySet.has(dateKey);
          const rest = !isOfficialWorkday && isRestDay(currentDate, settings.cycleStart, settings.workDays, settings.restDays);
          const isToday = dateKey === todayKey;
          const isWeekend = currentDate.getDay() === 0 || currentDate.getDay() === 6;

          if (holidayLabel) {
            holidayTotal += 1;
          }
          if (rest) {
            restTotal += 1;
          }
          if (isOfficialWorkday) {
            makeupTotal += 1;
          }
          const isOverlap = rest && (Boolean(holidayLabel) || isWeekend);

          if (isOverlap) {
            overlapTotal += 1;
          }

          const dayNode = document.createElement("div");
          dayNode.className = "day";

          if (day === 1 && startWeekday > 0) {
            dayNode.style.gridColumnStart = String(startWeekday + 1);
          }

          if (holidayLabel) {
            dayNode.classList.add("is-holiday");
          }
          if (rest) {
            dayNode.classList.add("is-rest");
          }
          if (isOverlap) {
            dayNode.classList.add("is-overlap");
          }
          if (isOfficialWorkday) {
            dayNode.classList.add("is-makeup");
          }
          if (isToday) {
            dayNode.classList.add("is-today");
          }
          if (isWeekend) {
            dayNode.classList.add("is-weekend");
          }
          if (currentDate.getDay() === 6) {
            dayNode.classList.add("is-saturday");
          }
          if (currentDate.getDay() === 0) {
            dayNode.classList.add("is-sunday");
          }

          const flag = holidayLabel
            ? `<span class="flag holiday">假</span>`
            : isOfficialWorkday
              ? `<span class="flag makeup">班</span>`
              : rest
                ? `<span class="flag rest">休</span>`
                : "";

          const label = holidayLabel || (isOfficialWorkday ? "调休上班" : "");

          dayNode.innerHTML = `
            <div class="day-flag-row">
              ${flag}
            </div>
            <div class="day-header">
              <span class="day-number ${isToday ? "today-mark" : ""}">${day}</span>
            </div>
            <div class="day-label">${label}</div>
          `;

          daysGrid.appendChild(dayNode);
        }

        monthNode.appendChild(daysGrid);
        monthsNode.appendChild(monthNode);

        holidayCount.textContent = String(holidayTotal);
        restCount.textContent = String(restTotal);
        makeupCount.textContent = String(makeupTotal);
        overlapCount.textContent = String(overlapTotal);

        saveSettings(settings);
        bindHoverBounce(monthNode);
        requestAnimationFrame(setupRevealObserver);
      }

      const initialSettings = loadSettings();
      const viewState = {
        month: clampMonth(Number.isInteger(initialSettings.viewMonth) ? initialSettings.viewMonth : new Date().getMonth())
      };

      async function initializePage() {
        const redirected = await ensureLatestBuild();
        if (redirected) {
          return;
        }

        applyTheme(loadThemePreference());
        applySurfaceStyle(loadSurfaceStyle());
        fillInputs(initialSettings);
        renderCalendar();
        refreshWeatherBadge();
        watchLocationPermission();
        bindHoverBounce(document);

        if (window.matchMedia) {
          const media = window.matchMedia("(prefers-color-scheme: dark)");
          media.addEventListener?.("change", (event) => {
            if (!localStorage.getItem(THEME_STORAGE_KEY)) {
              applyTheme(event.matches ? "dark" : "light");
            }
          });
        }
      }

      weatherBadge.addEventListener("click", () => {
        refreshWeatherBadge();
      });

      weatherBadge.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          refreshWeatherBadge();
        }
      });

      themeToggle.addEventListener("click", () => {
        toggleTheme();
      });

      styleToggle.addEventListener("click", () => {
        toggleSurfaceStyle();
      });

      applyButton.addEventListener("click", () => {
        renderCalendar();
      });

      yearInput.addEventListener("change", () => {
        const nextYear = Number(yearInput.value) || new Date().getFullYear();
        yearInput.value = nextYear;

        if (!cycleStartInput.value) {
          cycleStartInput.value = `${nextYear}-01-01`;
        }

        renderCalendar();
      });

      prevMonthButton.addEventListener("click", () => {
        shiftMonth(-1);
      });

      nextMonthButton.addEventListener("click", () => {
        shiftMonth(1);
      });

      todayMonthButton.addEventListener("click", () => {
        const now = new Date();
        yearInput.value = now.getFullYear();
        viewState.month = now.getMonth();
        renderCalendar();
      });

      initializePage();
    </script>
  </body>
</html>
