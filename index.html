<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSGO Major 赛程</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
:root {
  --bg: #f3f6fb;
  --panel: #ffffff;
  --panel-alt: #f8fbff;
  --line: #dbe4ef;
  --line-strong: #c6d5e5;
  --text: #1f2b3b;
  --muted: #6d7c90;
  --accent: #18a1d1;
  --accent-deep: #0c88b6;
  --accent-soft: #e7f7fd;
  --pink: #ef5f95;
  --green: #18a56c;
  --shadow: 0 18px 38px rgba(100, 127, 160, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at top left, rgba(24, 161, 209, 0.08), transparent 24%),
    linear-gradient(180deg, #f7f9fc 0%, #eef4fa 100%);
}

button {
  font: inherit;
}

img {
  max-width: 100%;
  display: block;
}

.app-shell {
  width: min(1320px, calc(100% - 28px));
  margin: 0 auto;
  padding: 28px 0 36px;
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: 18px;
}

.sidebar,
.content {
  min-width: 0;
}

.filter-card,
.toolbar,
.summary-banner,
.matches-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
}

.filter-card + .filter-card {
  margin-top: 16px;
}

.filter-header,
.panel-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
}

.filter-header {
  padding: 14px 14px 12px;
  border-bottom: 1px solid var(--line);
}

.filter-header h2,
.panel-head h2,
.summary-banner h1 {
  margin: 0;
}

.filter-header h2 {
  font-size: 1rem;
}

.filter-body,
.team-grid {
  padding: 14px;
}

.event-filter,
.simple-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: start;
}

.small-chip,
.event-chip,
.team-chip,
.toolbar-chip,
.date-chip,
.action-button,
.ghost-button {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--text);
  border-radius: 10px;
  cursor: pointer;
  transition: 180ms ease;
}

.small-chip,
.toolbar-chip {
  padding: 10px 14px;
}

.small-chip.active,
.event-chip.active,
.team-chip.active,
.toolbar-chip.active,
.date-chip.active {
  color: #fff;
  border-color: var(--accent);
  background: linear-gradient(135deg, var(--accent), var(--accent-deep));
}

.event-chip {
  width: 88px;
  padding: 10px 8px;
  display: grid;
  gap: 8px;
  justify-items: center;
}

.event-logo {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-family: "Space Grotesk", sans-serif;
  font-size: 0.78rem;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #12326b, #20a8da);
}

.event-name {
  font-size: 0.84rem;
  line-height: 1.35;
  text-align: center;
}

.game-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--panel-alt);
  border: 1px solid var(--line);
}

.game-logo {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  font-family: "Space Grotesk", sans-serif;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #1b2838, #4b6a8f);
}

.text-action {
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}

.team-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.team-chip {
  padding: 10px 8px;
  display: grid;
  gap: 8px;
  justify-items: center;
  text-align: center;
}

.team-mark,
.team-logo-lg {
  display: grid;
  place-items: center;
  background: #ffffff;
  border: 1px solid rgba(31, 43, 59, 0.08);
}

.team-mark {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  padding: 6px;
}

.team-mark img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.team-label {
  font-size: 0.82rem;
  line-height: 1.25;
}

.toolbar {
  padding: 10px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 10px;
  align-items: center;
}

.toolbar-chip-group {
  display: flex;
}

.date-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
  gap: 8px;
}

.date-chip {
  padding: 10px 12px;
  text-align: center;
}

.date-chip strong,
.date-chip span {
  display: block;
}

.date-chip strong {
  font-size: 0.98rem;
}

.date-chip span {
  margin-top: 4px;
  font-size: 0.84rem;
  color: var(--muted);
}

.date-chip.active span {
  color: rgba(255, 255, 255, 0.9);
}

.summary-banner {
  margin-top: 16px;
  padding: 20px 22px;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
}

.summary-kicker,
.panel-kicker {
  margin: 0 0 8px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 0.76rem;
  color: var(--accent);
}

.summary-banner h1 {
  font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
  font-size: clamp(1.5rem, 3vw, 2.2rem);
  letter-spacing: -0.04em;
}

.summary-copy,
.panel-copy,
.score-status,
.match-event-name {
  color: var(--muted);
}

.summary-copy {
  max-width: 34ch;
  margin: 0;
  line-height: 1.7;
}

.matches-panel {
  margin-top: 16px;
  padding: 18px;
}

.panel-head {
  margin-bottom: 14px;
}

.matches-list {
  display: grid;
  gap: 12px;
}

.match-row {
  display: grid;
  grid-template-columns: 260px 200px minmax(0, 1fr) 168px;
  gap: 12px;
  align-items: center;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: linear-gradient(180deg, #ffffff, #fbfdff);
}

.match-row.finished {
  border-left: 6px solid #97a6b8;
}

.match-row.upcoming,
.match-row.live {
  border-left: 6px solid var(--accent);
}

.match-time-block {
  display: grid;
  gap: 4px;
}

.match-time {
  font-family: "Space Grotesk", sans-serif;
  font-size: 1.02rem;
  font-weight: 700;
}

.status-text {
  font-size: 0.94rem;
  font-weight: 700;
}

.status-text.finished {
  color: var(--muted);
}

.status-text.upcoming {
  color: var(--accent);
}

.status-text.live {
  color: var(--green);
}

.event-badge {
  display: flex;
  align-items: center;
  gap: 10px;
}

.event-mini-logo {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-family: "Space Grotesk", sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #0f3772, #18a1d1);
}

.match-event-name {
  font-size: 0.9rem;
}

.versus-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 14px;
  align-items: center;
}

.side-team {
  display: grid;
  justify-items: center;
  gap: 6px;
}

.team-logo-lg {
  width: 56px;
  height: 56px;
  border-radius: 18px;
  padding: 8px;
}

.team-logo-lg img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.team-name-lg {
  font-size: 0.92rem;
  font-weight: 700;
}

.score-block {
  min-width: 92px;
  text-align: center;
}

.score {
  font-family: "Space Grotesk", sans-serif;
  font-size: clamp(2rem, 4vw, 2.6rem);
  font-weight: 700;
  line-height: 1;
  color: var(--pink);
}

.score.neutral {
  color: #8c9aab;
}

.score-status {
  margin-top: 8px;
  font-size: 0.8rem;
}

.action-group {
  display: flex;
  justify-content: end;
  gap: 8px;
}

.action-button,
.ghost-button {
  padding: 10px 14px;
  font-size: 0.92rem;
}

.action-button {
  color: #fff;
  border-color: var(--accent);
  background: linear-gradient(135deg, var(--accent), var(--accent-deep));
}

.ghost-button {
  background: #fff;
}

.empty-state {
  padding: 34px 18px;
  text-align: center;
  border: 1px dashed var(--line-strong);
  border-radius: 14px;
  color: var(--muted);
  background: var(--panel-alt);
}

@media (max-width: 1120px) {
  .app-shell {
    grid-template-columns: 1fr;
  }

  .team-grid {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .match-row {
    grid-template-columns: 1fr;
    justify-items: start;
  }

  .action-group {
    justify-content: start;
  }
}

@media (max-width: 760px) {
  .app-shell {
    width: min(100% - 16px, 1320px);
    padding-top: 16px;
  }

  .toolbar,
  .summary-banner {
    grid-template-columns: 1fr;
    display: grid;
  }

  .date-strip,
  .team-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .summary-banner,
  .matches-panel {
    padding: 16px;
  }

  .versus-row {
    grid-template-columns: 1fr;
    justify-items: start;
  }

  .side-team {
    justify-items: start;
  }

  .score-block {
    text-align: left;
  }
}

</style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <section class="filter-card">
          <div class="filter-header">
            <h2>赛事筛选</h2>
          </div>
          <div class="filter-body event-filter" id="event-filter"></div>
        </section>

        <section class="filter-card">
          <div class="filter-header">
            <h2>游戏筛选</h2>
          </div>
          <div class="filter-body simple-filter">
            <button class="small-chip active" type="button">全部</button>
            <div class="game-badge">
              <span class="game-logo">CS</span>
              <span>CSGO</span>
            </div>
          </div>
        </section>

        <section class="filter-card">
          <div class="filter-header">
            <h2>战队筛选</h2>
            <button class="text-action" id="clear-team" type="button">清空</button>
          </div>
          <div class="team-grid" id="team-filter"></div>
        </section>
      </aside>

      <main class="content">
        <section class="toolbar">
          <div class="toolbar-chip-group">
            <button class="toolbar-chip active" type="button">全部时间</button>
          </div>
          <div class="date-strip" id="date-strip"></div>
        </section>

        <section class="summary-banner">
          <div>
            <p class="summary-kicker">IEM Cologne Major Schedule</p>
            <h1 id="summary-title">2026 年 06 月 07 日比赛列表</h1>
          </div>
          <p class="summary-copy" id="summary-copy">
            当前展示 IEM 科隆 Major 的逐场比赛列表，并且已经替换为对应战队队标。
          </p>
        </section>

        <section class="matches-panel">
          <div class="panel-head">
            <div>
              <p class="panel-kicker">Match List</p>
              <h2>战队对战信息</h2>
            </div>
            <p class="panel-copy" id="result-count">0 场比赛</p>
          </div>
          <div class="matches-list" id="matches-list"></div>
        </section>
      </main>
    </div>

function getEvent(eventId) {
  return events.find((event) => event.id === eventId);
}

function getTeam(teamId) {
  return teams.find((team) => team.id === teamId);
}

function getStatusText(status) {
  if (status === "finished") {
    return "已结束";
  }

  if (status === "live") {
    return "进行中";
  }

  return "未开始";
}

function renderTeamLogo(team, className) {
  const logo = TEAM_LOGOS[team.id];

  if (!logo) {
    return `<span class="${className}">${team.tag}</span>`;
  }

  return `
    <span class="${className}">
      <img src="${logo}" alt="${team.name} 队标" />
    </span>
  `;
}

  eventFilter.innerHTML = events
    .map(
      (event) => `
        <button class="event-chip ${state.eventId === event.id ? "active" : ""}" data-event-id="${event.id}" type="button">
          ${renderEventLogo(event, "event-logo")}
          <span class="event-name">${event.name}</span>
        </button>
      `
    )
    .join("");

  eventFilter.querySelectorAll("[data-event-id]").forEach((button) => {
    button.addEventListener("click", () => {
      state.eventId = button.dataset.eventId;
      render();
    });
  });
}

function renderTeamFilter() {
  teamFilter.innerHTML = teams
    .map((team) => {

          ${renderTeamLogo(team, "team-mark")}
          <span class="team-label">${team.name}</span>
        </button>
      `;

  teamFilter.querySelectorAll("[data-team-id]").forEach((button) => {

      const nextId = button.dataset.teamId;
      state.teamId = state.teamId === nextId ? null : nextId;
      render();

      match.leftTeam === state.teamId ||
      match.rightTeam === state.teamId;

    return sameEvent && sameDate && sameTeam;
  });
}

          <div class="match-time-block">
            <div class="match-time">${match.date} ${match.time}</div>
            <div class="status-text ${match.status}">${getStatusText(match.status)}</div>
          </div>

          <div class="event-badge">
            <span class="event-mini-logo">${currentEvent.short}</span>
            <span class="match-event-name">${currentEvent.name}</span>
          </div>

          <div class="versus-row">
            <div class="side-team">
              ${renderTeamLogo(leftTeam, "team-logo-lg")}
              <span class="team-name-lg">${leftTeam.name}</span>
            </div>

            <div class="score-block">
              <div class="score ${neutralScore ? "neutral" : ""}">${match.leftScore}:${match.rightScore}</div>
              <div class="score-status">${match.status === "finished" ? "Bo1 已结束" : "Bo3 即将开始"}</div>
            </div>

            <div class="side-team">
              ${renderTeamLogo(rightTeam, "team-logo-lg")}
              <span class="team-name-lg">${rightTeam.name}</span>
            </div>
          </div>

          <div class="action-group">
            <button class="action-button" type="button">${match.action}</button>
            ${match.extraAction ? `<button class="ghost-button" type="button">${match.extraAction}</button>` : ""}
          </div>
        </article>
      `;
    })
    .join("");
}

function render() {
  renderEventFilter();
  renderTeamFilter();
  renderDateStrip();
  renderMatches();
}

clearTeamButton.addEventListener("click", () => {
  state.teamId = null;
  render();
});

render();

</script>
  </body>
</html>
