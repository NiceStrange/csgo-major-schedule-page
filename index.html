<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Eunice 的休息日历</title>
  <style>
    :root {
      --bg-top: #f7f8fc;
      --bg-bottom: #dbe1f2;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-strong: rgba(255, 255, 255, 0.9);
      --stroke: rgba(118, 131, 160, 0.16);
      --text: #273047;
      --muted: #7b86a0;
      --accent: #ff645d;
      --accent-soft: rgba(255, 100, 93, 0.1);
      --shadow: 0 28px 80px rgba(65, 77, 109, 0.16);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "SF Pro Display", "PingFang SC", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 16%, rgba(255, 255, 255, 0.95), transparent 24%),
        radial-gradient(circle at 86% 18%, rgba(255, 218, 220, 0.82), transparent 24%),
        radial-gradient(circle at 78% 80%, rgba(214, 226, 255, 0.9), transparent 22%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    .window {
      width: min(1320px, 100%);
      min-height: calc(100vh - 48px);
      border-radius: 34px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.46);
      border: 1px solid rgba(255, 255, 255, 0.62);
      box-shadow: 0 32px 100px rgba(48, 57, 81, 0.2);
      backdrop-filter: blur(22px) saturate(130%);
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 78px;
      padding: 18px 26px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(247, 249, 253, 0.72));
      border-bottom: 1px solid var(--stroke);
    }

    .traffic {
      display: flex;
      gap: 10px;
    }

    .traffic span {
      width: 13px;
      height: 13px;
      border-radius: 50%;
    }

    .traffic span:nth-child(1) { background: #ff5f57; }
    .traffic span:nth-child(2) { background: #febc2e; }
    .traffic span:nth-child(3) { background: #28c840; }

    .title {
      flex: 1;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-right: 84px;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: calc(100vh - 126px);
    }

    .sidebar {
      padding: 28px 24px;
      border-right: 1px solid rgba(120, 132, 160, 0.14);
      background: linear-gradient(180deg, rgba(248, 250, 255, 0.72), rgba(243, 246, 253, 0.5));
    }

    .card,
    .panel {
      background: var(--surface-strong);
      border: 1px solid rgba(255, 255, 255, 0.84);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    .card {
      padding: 22px;
      box-shadow: 0 16px 34px rgba(88, 99, 128, 0.09);
    }

    .section + .section {
      margin-top: 24px;
    }

    .eyebrow,
    .section-head {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8791a7;
    }

    .mini-month h2,
    .panel h1 {
      margin: 14px 0 6px;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .mini-month h2 {
      font-size: 32px;
    }

    .mini-month p,
    .rest-card p,
    .status-line {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-top: 18px;
      font-size: 13px;
      color: #80889b;
    }

    .mini-grid button {
      height: 29px;
      border-radius: 999px;
      background: transparent;
      color: inherit;
    }

    .mini-grid button.is-selected {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 12px 24px rgba(255, 100, 93, 0.28);
    }

    .mini-grid button.is-rest-day {
      color: #d05e5a;
      font-weight: 700;
    }

    .mini-grid button.is-today {
      outline: 2px solid rgba(255, 100, 93, 0.28);
      outline-offset: 2px;
    }

    .rest-card {
      display: grid;
      gap: 16px;
    }

    .rest-card h3 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.04em;
    }

    .rest-summary-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .rest-summary-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(79, 126, 255, 0.1);
      color: #4f69c8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .button-row {
      display: grid;
      gap: 12px;
    }

    .pill-btn,
    .icon-btn,
    .today-btn,
    .form-actions button {
      min-height: 42px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(255, 255, 255, 0.86);
      color: #5e677d;
      transition: transform 180ms cubic-bezier(0.32, 0.72, 0, 1), box-shadow 180ms cubic-bezier(0.32, 0.72, 0, 1), border-color 180ms cubic-bezier(0.32, 0.72, 0, 1);
    }

    .pill-btn:hover,
    .icon-btn:hover,
    .today-btn:hover,
    .form-actions button:hover,
    .day:hover {
      transform: translateY(-1px);
    }

    .pill-btn {
      width: 100%;
      font-weight: 600;
    }

    .status-line {
      min-height: 20px;
      font-size: 12px;
    }

    .main {
      padding: 28px;
    }

    .panel {
      padding: 28px;
      min-height: 100%;
    }

    .hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .panel h1 {
      font-size: 46px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 42px;
      min-height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 20px;
      padding: 0;
    }

    .today-btn,
    .form-actions .primary {
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
      border-color: transparent;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 16px 28px rgba(255, 100, 93, 0.24);
    }

    .weekdays,
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekdays {
      padding: 0 10px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8993a8;
    }

    .weekdays span {
      text-align: center;
    }

    .month-grid {
      gap: 1px;
      background: rgba(120, 132, 160, 0.14);
      border-radius: 24px;
      padding: 1px;
      overflow: hidden;
    }

    .day {
      min-height: 124px;
      background: rgba(255, 255, 255, 0.82);
      padding: 14px 14px 12px;
      position: relative;
      border: 0;
      text-align: left;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .day.is-number-centered {
      justify-content: center;
    }

    .day-head {
      position: relative;
      min-height: 52px;
      flex: 0 0 auto;
    }

    .day-head-slot {
      position: absolute;
      top: 6px;
      min-width: 50px;
      min-height: 20px;
    }

    .day-head-slot.is-start {
      left: 0;
    }

    .day-head-slot.is-end {
      right: 2px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .day-number-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 8px;
    }

    .day.is-number-centered .day-head {
      min-height: 0;
      flex: 1 1 auto;
    }

    .day.is-number-centered .day-number-wrap {
      padding-top: 0;
    }

    .day.is-other-month {
      background: rgba(249, 250, 252, 0.72);
      color: #b1b8c7;
    }

    .day.is-selected {
      background: rgba(255, 255, 255, 0.96);
      box-shadow: inset 0 0 0 1px rgba(79, 126, 255, 0.18);
    }

    .day-number {
      font-size: 16px;
      font-weight: 700;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      line-height: 1;
      position: relative;
      z-index: 1;
    }

    .day.is-today .day-number {
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 14px 24px rgba(255, 100, 93, 0.24);
    }

    .rest-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 18px;
      padding: 0 7px;
      border-radius: 999px;
      background: rgba(255, 100, 93, 0.1);
      border: 1px solid rgba(226, 82, 73, 0.14);
      color: #cf615e;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.02em;
      pointer-events: none;
      z-index: 1;
    }

    .rest-pill > span {
      position: relative;
      z-index: 1;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(20, 26, 40, 0.28);
      backdrop-filter: blur(8px);
      z-index: 20;
    }

    .modal.is-open {
      display: flex;
    }

    .modal-shell {
      width: min(460px, 100%);
      padding: 20px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.84);
      border-radius: 26px;
      box-shadow: 0 28px 80px rgba(44, 52, 76, 0.22);
    }

    .modal-shell h3 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .modal-shell p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .rest-form-grid {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .inline-split {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .rest-form-grid label {
      display: grid;
      gap: 6px;
      color: #51607d;
      font-size: 13px;
      font-weight: 600;
    }

    .rest-form-grid input {
      border: 1px solid rgba(118, 131, 160, 0.24);
      border-radius: 14px;
      background: rgba(248, 250, 255, 0.95);
      padding: 12px 14px;
      color: var(--text);
    }

    .form-actions {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .form-actions button {
      padding: 0 18px;
    }

    button,
    .mini-grid button,
    .day {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .pill-btn:focus-visible,
    .icon-btn:focus-visible,
    .today-btn:focus-visible,
    .mini-grid button:focus-visible,
    .day:focus-visible,
    .rest-form-grid input:focus-visible,
    .form-actions button:focus-visible {
      outline: none;
      box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.92),
        0 0 0 5px rgba(255, 112, 138, 0.28);
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid rgba(120, 132, 160, 0.14);
      }

      .title {
        margin-right: 0;
      }
    }

    @media (max-width: 860px) {
      body {
        padding: 12px;
      }

      .window {
        min-height: auto;
        border-radius: 24px;
      }

      .titlebar {
        flex-wrap: wrap;
      }

      .title {
        order: 3;
        width: 100%;
      }

      .sidebar,
      .main,
      .panel {
        padding: 18px;
      }

      .hero {
        flex-direction: column;
      }

      .weekdays {
        padding: 0 6px 12px;
      }

      .inline-split {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="window">
    <header class="titlebar">
      <div class="traffic" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="title">Eunice 的休息日历</div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <section class="card mini-month">
          <div class="eyebrow">Overview</div>
          <h2 id="miniMonthLabel">Current month</h2>
          <p id="miniMonthSubLabel">Today</p>
          <div class="mini-grid" id="miniGrid"></div>
        </section>

        <section class="section">
          <div class="card rest-card">
            <div class="rest-summary-head">
              <span class="section-head">Rest Cycle</span>
              <span class="rest-summary-badge" id="restCycleBadge">3 / 1</span>
            </div>
            <h3 id="restSummaryTitle">按上 3 休 1 循环</h3>
            <p id="restSummaryText">当前高亮仅显示自定义休息日，普通日期不再附带其他日程信息。</p>
            <div class="button-row">
              <button class="pill-btn" type="button" id="openRestModal">设置休息日</button>
              <div class="status-line" id="statusLine" aria-live="polite"></div>
            </div>
          </div>
        </section>
      </aside>

      <main class="main">
        <section class="panel">
          <div class="hero">
            <div>
              <h1 id="heroTitle">Current month</h1>
            </div>
            <div class="hero-actions">
              <button class="icon-btn" type="button" data-nav="-1" aria-label="Previous month">‹</button>
              <button class="icon-btn" type="button" data-nav="1" aria-label="Next month">›</button>
              <button class="today-btn" type="button" id="todayButton">Today</button>
            </div>
          </div>

          <div class="weekdays" id="weekdaysRow">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
          </div>

          <div class="month-grid" id="calendarGrid"></div>
        </section>
      </main>
    </div>
  </div>

  <div class="modal" id="restModal" aria-hidden="true">
    <div class="modal-shell">
      <h3>设置休息日</h3>
      <p>设置工作与休息周期，默认按照上 3 天休息 1 天循环。</p>
      <form id="restForm">
        <div class="rest-form-grid">
          <div class="inline-split">
            <label>
              Work days
              <input id="restWorkDays" name="work-days" type="number" min="1" max="30" required value="3">
            </label>
            <label>
              Rest days
              <input id="restRestDays" name="rest-days" type="number" min="1" max="30" required value="1">
            </label>
          </div>
          <label>
            Cycle start date
            <input id="restStartDate" name="rest-start-date" type="date" required>
          </label>
        </div>
        <div class="form-actions">
          <button type="button" id="cancelRestButton">Cancel</button>
          <button class="primary" type="submit">Save cycle</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "rest-calendar-state-v1";
    const EMBEDDED_BUILD_VERSION = "1781592384276";
    const VERSION_ENDPOINT = "./version.json";

    function cloneDate(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function createTodayDate() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function formatDateKey(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function parseStoredDate(value, fallbackDate) {
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) {
        return cloneDate(fallbackDate);
      }
      return new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
    }

    function differenceInDays(a, b) {
      const msPerDay = 24 * 60 * 60 * 1000;
      const utcA = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
      const utcB = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
      return Math.round((utcA - utcB) / msPerDay);
    }

    function setBuildVersionInUrl(version, shouldReload) {
      if (!version) {
        return false;
      }
      const url = new URL(window.location.href);
      if (url.searchParams.get("v") === version) {
        return false;
      }
      url.searchParams.set("v", version);
      if (shouldReload) {
        window.location.replace(url.toString());
      } else {
        window.history.replaceState({}, "", url.toString());
      }
      return true;
    }

    async function syncBuildVersion() {
      setBuildVersionInUrl(EMBEDDED_BUILD_VERSION, false);
      try {
        const response = await fetch(`${VERSION_ENDPOINT}?ts=${Date.now()}`, {
          cache: "no-store",
          headers: { "cache-control": "no-cache" },
        });
        if (!response.ok) {
          return false;
        }
        const payload = await response.json();
        const latestVersion = typeof payload.version === "string" ? payload.version : EMBEDDED_BUILD_VERSION;
        const currentVersion = new URL(window.location.href).searchParams.get("v");
        if (latestVersion && currentVersion !== latestVersion) {
          setBuildVersionInUrl(latestVersion, true);
          return true;
        }
      } catch (error) {
        return false;
      }
      return false;
    }

    const liveToday = createTodayDate();

    const initialState = {
      today: cloneDate(liveToday),
      currentDate: cloneDate(liveToday),
      selectedDate: cloneDate(liveToday),
      restCycle: {
        workDays: 3,
        restDays: 1,
        startDate: formatDateKey(liveToday),
      },
    };

    function loadStoredState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return null;
        }
        const parsed = JSON.parse(raw);
        const storedToday = parseStoredDate(parsed.lastSeenToday, initialState.today);
        const shouldResetToLiveToday = differenceInDays(initialState.today, storedToday) !== 0;
        return {
          currentDate: shouldResetToLiveToday
            ? cloneDate(initialState.today)
            : parseStoredDate(parsed.currentDate, initialState.today),
          selectedDate: shouldResetToLiveToday
            ? cloneDate(initialState.today)
            : parseStoredDate(parsed.selectedDate, initialState.today),
          restCycle: {
            ...initialState.restCycle,
            ...(parsed.restCycle || {}),
          },
        };
      } catch (error) {
        return null;
      }
    }

    const state = {
      ...initialState,
      ...(loadStoredState() || {}),
    };

    const refs = {
      heroTitle: document.getElementById("heroTitle"),
      miniMonthLabel: document.getElementById("miniMonthLabel"),
      miniMonthSubLabel: document.getElementById("miniMonthSubLabel"),
      miniGrid: document.getElementById("miniGrid"),
      calendarGrid: document.getElementById("calendarGrid"),
      restCycleBadge: document.getElementById("restCycleBadge"),
      restSummaryTitle: document.getElementById("restSummaryTitle"),
      restSummaryText: document.getElementById("restSummaryText"),
      statusLine: document.getElementById("statusLine"),
      navButtons: Array.from(document.querySelectorAll("[data-nav]")),
      todayButton: document.getElementById("todayButton"),
      openRestModal: document.getElementById("openRestModal"),
      restModal: document.getElementById("restModal"),
      restForm: document.getElementById("restForm"),
      restWorkDays: document.getElementById("restWorkDays"),
      restRestDays: document.getElementById("restRestDays"),
      restStartDate: document.getElementById("restStartDate"),
      cancelRestButton: document.getElementById("cancelRestButton"),
    };

    const monthFormatter = new Intl.DateTimeFormat("en-US", { month: "long", year: "numeric" });
    const fullFormatter = new Intl.DateTimeFormat("en-US", { weekday: "long", month: "long", day: "numeric" });

    function persistState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        lastSeenToday: state.today.toISOString(),
        currentDate: state.currentDate.toISOString(),
        selectedDate: state.selectedDate.toISOString(),
        restCycle: state.restCycle,
      }));
    }

    function toDateKey(date) {
      return formatDateKey(date);
    }

    function isSameDay(a, b) {
      return a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
    }

    function addDays(date, amount) {
      const result = cloneDate(date);
      result.setDate(result.getDate() + amount);
      return result;
    }

    function toDateFromKey(key) {
      const [year, month, day] = key.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function isRestDay(date) {
      const workDays = Math.max(1, Number(state.restCycle.workDays || 0));
      const restDays = Math.max(1, Number(state.restCycle.restDays || 0));
      const cycleLength = workDays + restDays;
      const startDate = toDateFromKey(state.restCycle.startDate);
      const offset = differenceInDays(date, startDate);
      const normalized = ((offset % cycleLength) + cycleLength) % cycleLength;
      return normalized >= workDays;
    }

    function getVisibleDays() {
      const firstOfMonth = new Date(state.currentDate.getFullYear(), state.currentDate.getMonth(), 1);
      const start = addDays(firstOfMonth, -firstOfMonth.getDay());
      return Array.from({ length: 35 }, (_, index) => {
        const date = addDays(start, index);
        return { date, inCurrentMonth: date.getMonth() === state.currentDate.getMonth() };
      });
    }

    function getMiniGridDays(referenceDate) {
      const year = referenceDate.getFullYear();
      const month = referenceDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      return Array.from({ length: daysInMonth }, (_, index) => new Date(year, month, index + 1));
    }

    function setStatus(message) {
      refs.statusLine.textContent = message;
    }

    function renderMiniGrid() {
      refs.miniGrid.innerHTML = "";
      refs.miniMonthLabel.textContent = monthFormatter.format(state.currentDate);
      refs.miniMonthSubLabel.textContent = fullFormatter.format(state.selectedDate);
      getMiniGridDays(state.currentDate).forEach((date) => {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.textContent = String(date.getDate());
        if (isSameDay(date, state.selectedDate)) {
          cell.classList.add("is-selected");
        }
        if (isSameDay(date, state.today)) {
          cell.classList.add("is-today");
        }
        if (isRestDay(date)) {
          cell.classList.add("is-rest-day");
        }
        cell.addEventListener("click", () => {
          state.currentDate = cloneDate(date);
          state.selectedDate = cloneDate(date);
          persistState();
          render();
        });
        refs.miniGrid.appendChild(cell);
      });
    }

    function renderHero() {
      refs.heroTitle.textContent = monthFormatter.format(state.currentDate);
      refs.restCycleBadge.textContent = `${state.restCycle.workDays} / ${state.restCycle.restDays}`;
      refs.restSummaryTitle.textContent = `按上 ${state.restCycle.workDays} 休 ${state.restCycle.restDays} 循环`;
      refs.restSummaryText.textContent = `周期起始日：${state.restCycle.startDate}`;
    }

    function renderGrid() {
      const days = getVisibleDays();
      refs.calendarGrid.innerHTML = "";

      days.forEach(({ date, inCurrentMonth }) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "day is-number-centered";
        button.dataset.date = toDateKey(date);
        if (!inCurrentMonth) {
          button.classList.add("is-other-month");
        }
        if (isSameDay(date, state.today)) {
          button.classList.add("is-today");
        }
        if (isSameDay(date, state.selectedDate)) {
          button.classList.add("is-selected");
        }

        const head = document.createElement("div");
        head.className = "day-head";

        const startSlot = document.createElement("div");
        startSlot.className = "day-head-slot is-start";

        const numberWrap = document.createElement("div");
        numberWrap.className = "day-number-wrap";
        const number = document.createElement("div");
        number.className = "day-number";
        number.textContent = String(date.getDate());
        numberWrap.appendChild(number);

        const endSlot = document.createElement("div");
        endSlot.className = "day-head-slot is-end";

        if (isRestDay(date)) {
          const restPill = document.createElement("span");
          restPill.className = "rest-pill";
          const restLabel = document.createElement("span");
          restLabel.textContent = "REST";
          restPill.appendChild(restLabel);
          endSlot.appendChild(restPill);
        }

        head.append(startSlot, numberWrap, endSlot);
        button.appendChild(head);

        button.addEventListener("click", () => {
          state.selectedDate = cloneDate(date);
          if (inCurrentMonth) {
            state.currentDate = new Date(date.getFullYear(), date.getMonth(), 1);
          }
          persistState();
          render();
        });

        refs.calendarGrid.appendChild(button);
      });
    }

    function openRestModal() {
      refs.restWorkDays.value = String(state.restCycle.workDays);
      refs.restRestDays.value = String(state.restCycle.restDays);
      refs.restStartDate.value = state.restCycle.startDate;
      refs.restModal.classList.add("is-open");
      refs.restModal.setAttribute("aria-hidden", "false");
      refs.restWorkDays.focus();
    }

    function closeRestModal() {
      refs.restModal.classList.remove("is-open");
      refs.restModal.setAttribute("aria-hidden", "true");
      refs.restForm.reset();
    }

    function saveRestCycle(event) {
      event.preventDefault();
      const workDays = Math.max(1, Number(refs.restWorkDays.value));
      const restDays = Math.max(1, Number(refs.restRestDays.value));
      const startDate = refs.restStartDate.value;
      if (!startDate) {
        setStatus("Cycle start date is required.");
        return;
      }
      state.restCycle = { workDays, restDays, startDate };
      persistState();
      closeRestModal();
      render();
      setStatus(`Rest cycle updated to work ${workDays} day(s), rest ${restDays} day(s).`);
    }

    function shiftMonth(direction) {
      const next = cloneDate(state.currentDate);
      next.setMonth(next.getMonth() + direction);
      next.setDate(1);
      state.currentDate = next;
      if (state.selectedDate.getMonth() !== next.getMonth() || state.selectedDate.getFullYear() !== next.getFullYear()) {
        state.selectedDate = cloneDate(next);
      }
      persistState();
      render();
    }

    function bindEvents() {
      refs.navButtons.forEach((button) => {
        button.addEventListener("click", () => shiftMonth(Number(button.dataset.nav)));
      });

      refs.todayButton.addEventListener("click", () => {
        state.currentDate = cloneDate(state.today);
        state.selectedDate = cloneDate(state.today);
        persistState();
        render();
        setStatus("Returned to today.");
      });

      refs.openRestModal.addEventListener("click", openRestModal);
      refs.restForm.addEventListener("submit", saveRestCycle);
      refs.cancelRestButton.addEventListener("click", closeRestModal);

      refs.restModal.addEventListener("click", (event) => {
        if (event.target === refs.restModal) {
          closeRestModal();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && refs.restModal.classList.contains("is-open")) {
          closeRestModal();
        }
      });
    }

    function render() {
      renderHero();
      renderMiniGrid();
      renderGrid();
    }

    function bootstrap() {
      bindEvents();
      render();
      syncBuildVersion();
    }

    bootstrap();
  </script>
</body>
</html>
